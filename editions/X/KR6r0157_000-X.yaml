body:
  text: 洪覺範林間錄序臨川謝逸撰洪覺範得自在三昧於雲菴老人故能游戲翰墨場中呻吟謦欬皆成文章每與林間勝士抵掌清談莫非尊宿之高行叢林之遺訓諸佛菩薩之微旨賢士大夫之餘論每得一事隨即錄之垂十年間得三百餘事從其游者本明上人外若簡率而內甚精敏燕坐之暇以其所錄析為上下帙名之曰林間錄因其所錄有先後故不以古今為詮次得於談笑而非出於勉強故其文優游平易而無艱難險阻之態人皆知明之有是錄也所至之地借觀者成市明懼字畫漫滅而傳寫失真於是刻之於板而俾余為序以壽後世焉余謂斯文之作有補於宗教如儉歲之粱稷寒年之繒纊豈待余序然後傳哉願託斯文以傳不朽此余所以欲默而不能也昔樂廣善清言而不長於筆請潘岳為表先作二百語以述己之志岳取而次比之便成名筆時人咸云若廣不假岳之筆岳不假廣之旨無以成斯美也今覺範口之所談筆之所錄兼有二子之美何哉大抵文士有妙思者未必有美才有美才者未必有妙思惟體道之士見亡執謝定亂兩融心如明鏡遇物便了故縱口而談信筆而書無適而不真也然則覺範所以兼二子之美者得非體道而然耶余是以知士不可不知道也覺範名慧洪筠陽人今住臨川北景德禪寺盖赴顯謨閣待制朱公之請云大觀元年十一月一日序
