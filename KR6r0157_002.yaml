body:
  text: 大覺禪師皇祐二年十二月十九日仁宗皇帝詔至後苑齊於化成殿齊畢傳宣效南方禪林儀範開堂演法又宣左街副僧録慈雲大師清滿啓白滿謝恩畢倡曰帝苑春回皇家會啓萬乘既臨於舜殿兩街獲奉於堯眉爰當和煦之辰正是闡揚之日宜談祖道上副宸衷謹白璉遂升座問答罷乃曰古佛堂中曾無異說流通句內誠有多談得之者妙用無虧失之者觸途成滯所以溪山雲月處處同風水鳥樹林頭頭顯道若向迦葉門下直得堯風蕩蕩舜日高明野老謳歌漁人鼓舞當此之時純樂無為之化焉知有恁麼事皇情大悅杜祁公張文定公皆致政居睢陽里巷相往來有朱承事者以醫藥游二老之間祁公徑正未嘗雜學每笑安道侫佛對賓客必以此嘲之文定但笑而已朱承事乘間謂文定曰杜公天下偉人惜未知此事公有力盍不勸發之文定曰君與此老緣熟勝我我止能助之耳朱讋譍而去一日祁公呼朱切脉甚急朱謂使者曰汝先往白相公但云看首楞嚴未了使者如所告馳白祁公默然久之乃至隱几揖令坐徐曰老夫以君疏通解事不意近亦例闒茸如所謂楞嚴者何等語乃爾耽著聖人微言無出孔孟捨此而取彼是大惑也朱曰相公未讀此經何以知不及孔孟以某觀之似過之也袖中出其首卷曰相公試閲之祁公熟視朱不得已乃取默看不覺終軸忽起大驚曰世間何從有此書耶遣使盡持其餘來遍讀之捉朱手曰君真我知識安道知之久而不以告我何哉即命駕來見文定敘其事安道曰譬如人失物忽已尋得但當喜其得之而已不可追悔得之早晚也僕非不相告以公與朱君緣熟故遣之耳雖佛祖化人亦必籍同事也祁公大悅荊州福昌善禪師明教寬公之子為人敬嚴祕重大法初住持時屋廬十餘間殘僧三四輩而已善晨香夕燈升堂說法如臨千衆而叢林受用所宜有者咸修備之過客至肅然增敬十餘年而衲子方集天下向風長想南禪師與悅公亦在會下南公曰我時病寒服藥須被出汗遣文悅遍院借之皆無有百餘人例以紙為之今則又不然重氈之上以褥覆之一日三覺可謂快活時世也華嚴論曰若隨法性萬相都無若隨智力衆相隨現隱顯隨緣都無作者凡夫執著用作無明執障既無智用自在永明禪師曰不離一真之境化儀百變是以箭穿石虎非功力之所能醉告三軍豈麴糵之所造筍抽寒谷非陽和之所生魚躍冰河豈網羅之所致悉為心感顯此靈通故知萬法施為皆自心之力耳金峰玄明禪師曹山耽章禪師之嗣道㒵奇古機辨冠衆一日升座曰事存函蓋合理應箭鋒拄若人道得我分半院與伊時有僧出衆明下座約住曰相見易得好共事難為人去大本禪師年八十終蘇州靈嵓山臨行門弟子請曰和尚道遍天下今日不可無偈告安坐本熟視曰癡子我尋常尚懶作偈今日特地圖什麼尋常要臥便臥不可今日特地坐也索紙筆大書五字曰後事付守榮擲筆憨臥若熟睡然撼之已去矣首楞嚴經二種轉依者一轉染得淨二轉迷得悟菩提是生得謂二障障不生故今斷障得名生得涅槃名為顯得本性清淨客塵翳故今斷而彼顯名為顯得然轉位有六第一損力益能轉謂初二位以勝解慚愧力損本識中染種勢力益淨種功能漸伏現行亦名為轉也第二通達轉由見道達真力斷二障麁證一分真實轉依故第三修習轉謂地地漸斷俱生證真轉依也第四果滿轉謂究竟位以金剛定永斷本來一切粗重頓證佛果圓滿轉依也第五下劣轉謂二乘厭苦欣寂證真擇滅無勝堪能故第六廣大轉謂大乘位俱無欣厭通達二空雙斷二障頓證無上菩提有勝堪能故唐高僧號懶瓚隱居衡山之頂石窟中嘗作歌其略曰世事悠悠不如山丘臥藤蘿下塊石枕頭其言宏妙皆發佛祖之奧德宗聞其名遣使馳詔召之使者即其窟宣言天子有詔尊者幸起謝恩瓚方撥牛糞火尋煨芋食之寒涕垂膺未嘗答使者笑之且勸瓚拭涕瓚曰我豈有工夫為俗人拭涕耶竟不能致而去德宗欽嘆之豫嘗見其像垂頤瞋目氣韻超然若不可犯干者為題其上曰糞火但知黃獨美銀鉤那識紫泥新尚無心緒收寒涕豈有工夫問俗人律部曰昔有一國大亂民爭逃他道旁室廬皆空一老兵過之聞呱呱之聲入視之有嬰兒仰視屋梁老兵隨觀之乃懸飯纕耳為解開示之則灰也嬰兒見之即死蓋其母欲弃去不忍殺懸此纕紿云此飯也故其係念不忘識其為灰則無餘想矣乃知三界生死留滯皆想所持故古之達法大士臨終超然自得者無別道但識法根源而已叢林相傳石頭和尚施身食虎祝曰我宗如他日大振必先食吾足虎果自足而食豫竊笑之紹聖初游南臺見泰布衲祭石頭明上座文敘其施身食虎甚詳乃知後人不能明遂相傳為遷禪師也又曰清凉法眼禪師臨終以書別李國主主幸所居而法眼不去侍者壓以米纕乃卒按本傳法眼以周顯德五年戊午七月十七日示疾閏月剃髮沐浴告衆坐逝未嘗先以書約國主也而韓希載作悟空禪師則曰師臨終以書別皇帝中夜聞鐘聲御升元閣泣而送之又曰洞山悟本禪師見母行乞佯為不識母竟死於路旁往視之有米數合為投大衆粥鍋中以薦冥福悟本獨庵寒溪百結最有年至住新豐已六十餘自巖頭雪峰欽山三人相尋而至於是積衆幾千人則母蓋不啻八十歲矣借使聞其子顯著自東吳孤行而來不亦難乎又曰玄沙欲出家懼其父不從方同捕魚因覆舟溺死之玄沙天資高妙必不爾獨不知何所據便爾不疑此直不情者記之以自藏安知誣毀先德為罪逆必有任其咎者不可不慎也香山居士白樂天醉心內典與之游者多高人勝士觀其與濟上人書鉤深索隱精確高妙未嘗不置卷長嘆想見其為人恨不見濟公所答耳因作補濟上人答樂天書一首并樂天問詞録於此月日弟子太原白居易白濟上人侍者昨者頂謁時不以愚蒙言及佛法或未了者許重討論今經典間未諭者其義有二欲面問答恐彼此卒卒語言不盡故粗形於文字願詳覽之敬佇報章以開未悟所望所望佛以無上大慧觀一切衆生知其根性大小不等而以方便智說方便法故為闡提說十善法為小乘說四諦法為中乘說十二因緣法為大乘說六波羅蜜法皆對病根投以良藥此蓋方便教中不易之典也何者若為小乘人說大乘法心則狂亂狐疑不信所謂無以大海內於牛跡也若為大乘人說小乘法是以穢食置於寶器所謂彼自無瘡勿傷之也故維摩經總其義云為大醫王應病與藥又首楞嚴三昧經云不先思量而說何法隨其所應而為說法正是此義耳猶恐說法者不隨人之根性也故又法華經戒云若但贊佛乘衆生沒在苦不能信是法破法不信故如此非獨慮說者不能救病亦恐聞者不信沒在罪苦也則佛之付囑豈不丁寧耶何則法王經云若定根基為小乘人說小乘法為大乘人說大乘法為闡提人說闡提法是斷佛性是滅佛身是說法人當歷百千萬劫墮諸地獄縱佛出世猶未得出若生人中缺唇無舌獲如是報何以故衆生之性即是法性從本已來無有增減云何於中分別病藥又云於諸法中若說高下即名邪說其口當破其舌當裂何以故一切衆生心垢同一垢心淨同一淨衆生若病應同一病衆生須藥應同一藥若說多法即名顛倒何以故為妄分別拆善惡法破一切法故隨機說法斷佛道故此又了然不壞之義也金剛三昧經云皆以一味道終不以小乘無有諸雜味猶如一雨潤又金剛經云是法平等無有高下是名阿耨多羅三藐三菩提據此後三經則與前三經義甚相戾也其故何哉若云依維摩詰謂富樓那云先當入定觀此人心然後說法又云不觀人根不應說法夫以富樓那之通慧又親奉如來為大弟子尚未能觀知人心況後五百歲末法中弟子豈能盡觀知人心而後說法乎設使觀知人心若彼發小乘心而為說大乘法可乎若未能觀彼心而率己意說又可乎既未能觀與默然不說又可乎若云依義不依語則上六經之義互相違反其將孰依乎若云依了義經則三世諸佛一切善法皆從此經出孰名為不了義經乎況諸經中與維摩法華首楞嚴之說同者非一也與法王金剛三昧之說同者亦非一也不可遍舉故於二義中各舉三經此六經皆上人常所講讀者今故引以為問必有甚深之旨焉今且有人忽問法於上人上人或能觀知其心或未能觀知其心將應病與藥而為說耶將同一病一藥而為說耶若應病與藥又是有高下是有雜味即反法王等三經之義豈徒反其義又獲如上所說之罪報矣若同一病一藥為說必當說大乘大乘即佛乘也若讚佛乘且不隨應且不救病即反維摩等三經之義豈徒反其義又使衆生沒在罪苦矣六者皆如來說如來是真語者實語不誑語不異語者今隨此則反彼順彼則逆此設有問上人其將何法以對焉此其未諭者一也又五蘊者色受想行識是也十二因緣者無明緣行行緣識識緣名色名色緣六入六入緣觸觸緣受受緣愛愛緣取取緣有有緣生生緣老死憂悲苦惱是也夫五蘊十二因緣蓋一法也蓋一義也略言之則五詳之則為十二雖名數多少或殊其於倫次轉遷合同條貫今五蘊中則色受想行識相次而十二緣中則行識色入觸受想緣一則色在行前一則色次行後正序之既不類逆倫之又不同若佛次第而言則不應有此雜亂若謂偶然而說則不當名為因緣前後不倫其義安在此其未諭者二也上人耆年大德後學宗師就出家中又以說法而作佛事必能研精二義合而通之仍望指陳著於翰墨蓋欲藏諸篋笥永永不忘也其餘疑義亦續咨問居易頓首豫補其答曰辱賜書蒙以教乘為問𮨇惟魯鈍之資何足以當天縱之辨然敢不竭疲陋以塞外護為法之勤耶如居士所論六經二義與夫行色不倫之說為不通者在不痛思自所問端方便智三言而已了此三言則雖百千妙義無盡法門可不究而解矧所謂維摩法王前後六經相戾之義乎方便智者如將將兵權謀所施非有定式其發如雷霆如機括故能消過於未然折衝於千里在一時耳豈據典故哉夫軍勢之虗實將氣之勇怯陳形之可否成敗之先見或有定論例吾教三乘以觀根授法不可參亂是也以勇怯之氣為虗實之勢以施其事則誤矣例吾法謂不可以大乘之法授小乘之人而小乘之人終不堪受大乘之法如維摩法華等三經所以丁寧告諭者是也法王等三經又明告直指纖悉蕩除之亦所當爾何以知之如將兵者意在濟亂以安國則如來之意豈非欲開迷以顯智乎執三乘之語言為佛之方便智者失之甚矣彼特品第衆生根器之說不能了者反墮常見即外道非佛道也執衆生佛性自無始來無有是事者又墮斷見即外道非佛道也華嚴經曰凡愚之人迷佛方便執有三乘法華經曰尋念過去佛亦應說三乘來書所疑可以釋矣涅槃經曰欲得早成佛者與早成欲遲成佛者與遲成起信論曰世尊為勇猛衆生說成佛在一念為懈怠衆生說得果須滿僧祇者真方便智之旨神而明之則能變通與奪施之以成就衆生也一代時教以三宗攝之所謂法相破相性宗也前之六經二義乃法相破相二宗所攝此二宗自不許相難以建立蕩除宗異故也又疑為法師者不能定觀人之根過慮誤授人以法且有罪苦夫知法比丘雖凡夫具足煩惱之軀然其志好明達慧辨猛利非果位小乘可比如迦陵鳥在殼則聲壓衆鳥如堅好木茁地則已秀群木又況維摩所訶富樓那自言其過有以也哉如是而論恐尚紆疑請借近事以明之王公大人之閲天下士非必龍章玉山其必先以言語言語者德行之候故曰有德者必有言又曰觀其所由察其所安人焉廋哉雖古之聖人莫能外此則知法者觀人之根大小又豈有他術乎如居士所疑色受想行識與夫十二有支因緣之法名次不倫㸦有錯謬者未辨名目之理故也夫色等五蘊乃三苦已成之軀十二有支乃三世生因之法如華嚴十地品云於第一義不了故名無明所作業果是行行依止初心是識共生四取蘊為名色等者其敘本末㳂襲理固然也般若經則曰色即是空空即是色色不異空空不異色受想行識亦復如是者破有法不真故也且色體尚爾況四蘊但名而已哉般若諸經破有之教故言五蘊則色居行之前華嚴十地品諸經敘㳂襲之因故色在行之後非略言則五詳言則十二也法之所本要本於理而當於義不必守名句以自滯多病久廢講前之所陳者皆教乘之深旨非敢臆斷意諭至於言謂之不及而可以模鑄魔佛了辨同異者又未可遽言也斷際禪師嘗與異僧游天台行數日值江漲不能濟植杖久之異僧以笠當舟登之浮去斷際嫚罵曰我早知汝定捶折其脛乃快也異僧嘆曰道人猛利非我所及雪峰嵓頭欽山自湘中入江南至新吳山之下欽山濯足㵎側見菜葉而喜指以謂二人曰此山必有道人可㳂流尋之雪峰恚曰汝智眼太濁他日如何辨人彼不惜福如此住山何為哉古之人擇師結友如是其審哉法燈泰欽禪師初住洪州雙林乃曰山僧本擬深藏山谷遣日過生緣清凉老人有不了底公案所以出來為他了却若有人問便說似伊時一僧出問如何是老人未了底欽拽杖擊之僧曰我有何過欽曰祖禰不了殃及兒孫李國主從容問曰先師有什麼不了底公案欽曰現分析底國主駭之欽少年時其悟解已逸格然未為人知獨法眼禪師深奇之性忽繩墨不事事嘗自清凉遣化維楊不奉戒律過時未歸一衆傳以為笑法眼遣偈往呼之既歸使為衆燒浴一日法眼問大衆曰虎項下金鈴何人解得對者皆不契欽適自外至法眼理前語問之欽曰大衆何不道繫者解得於是人人改觀法眼曰汝輩這回笑渠不得也王文公方大拜賀客塞門公默坐甚久忽題于壁間曰霜筠雪竹鍾山寺投老歸歟寄此生又元宵賜宴相國寺觀俳優坐客歡甚公作偈曰諸優戲場中一貴復一賤心知本自同所以無欣怨豫嘗謂同學曰此老人通身是眼瞞渠一點也不得臨濟大師曰大凡舉唱宗乘須一句中具三玄一玄中具三要有玄有要諸方衲子多溟涬其語獨汾陽無德禪師能妙達其旨作偈通之曰三玄三要事難分得旨忘言道易親一句明明該萬象重陽九日菊花新非特臨濟宗喜論三玄石頭所作參同契備具此旨竊嘗深觀之但易玄要之語為明暗耳文止四十餘句而以明暗論者半之篇首便標曰靈源明皎潔枝派暗流注又開通發揚之曰暗合上中言明明清濁句在暗則必分上中在明則須明清濁此體中玄也至指其宗而示其意則曰本末須歸宗尊卑用其語故下廣敘明暗之句奕奕聯連不已此句中玄也及其辭盡也則又曰謹白參玄人光陰莫虗度道人日用能不遺時失候則是真報佛恩此意中玄也法眼為之注釋天下學者宗承之然豫獨恨其不分三法但一味作體中玄解失石頭之意李後主讀當明中有暗注辭曰玄黃不真黑白何咎遂開悟此悟句中玄為體中玄耳如安楞嚴破句讀首楞嚴亦有明處豫懼學者雷同其旨宗門妙意指趣今叢林絶口不言老師宿德日以凋喪末學小生日以譁喧無復明辨因記先德銓量大法宗趣於此以俟有志者此方教躰以音聞應機故明導者假以語言發其智用然以言遣言以理辨理則妙精圓明未嘗間斷謂之流注真如此汾陽所謂一句明明該萬象者也得之者神而明之不然死於語下故其應機而用皆脫略窠臼使不滯影迹謂之有語中無語此汾陽所謂重陽九日菊花新者也三玄之設本猶遣病故達法者貴其知意知意則索爾虗間隨緣任運謂之不遺時此汾陽所謂得意忘言道易親者也古塔主喜論明此道然論三玄則可以言傳至論三要則未容無說豈不曰一玄中具三要有玄有要自非親證此道莫能辨也廬山玉㵎林禪師作雲門北斗藏身因緣偈曰北斗藏身為舉揚法身從此露堂堂雲門賺殺他家子直至如今謾度量五祖戒禪師雲門的孫有機辨嘗罷祖峰法席游山南見林問作偈之意林舉目視之戒曰若果如此雲門不直一錢公亦當無兩目遂去林竟如所言而戒暮年亦失一目今妄意測度先德之旨疑誤後生者亦可以少戒天台宗講徒曰昔智者大師聞西竺異比丘言龍勝菩薩嘗於灌頂部誦出大佛頂首楞嚴經十卷流在五天皆諸經所未聞之義唯心法之大旨五天世主保護祕嚴不妄傳授智者聞之日夜西向禮拜願早至此土續佛壽命然竟不及見唐神龍初此經方至廣州翻譯今市工販鬻遍天下而學者往往有畢生不曾識之者法輕則信種自劣可嘆也古老衲住山多託物寓意既自游戲亦欲悟人如子湖之畜犬道吾之巫衣端笏獨雪峰歸宗西院皆握木蛇故雪峰寄西院偈云本色住山人且無刀斧痕豫元符間至踈山見仁禪師𦘕像亦握木蛇嘗有僧問曰和尚手中是什麼物答曰是曹家女因嘆其孤韻超能清凉熱惱為作贊曰三支習氣其毒熾然薰蒸識心盤屈糾纏衆生不明橫生疑怖忽然見之輒自驚仆空華世間本離生滅廓然十方露其窟穴惟矮師叔是大幻師與奪萬法自在娛嬉乃知大千皆公戲具手中木蛇是曹家女永明和尚問曰此根本識心既稱為一切法體又云常住不動只如萬法即此一心有離此一心有若即心萬法遷變此心云何稱為常住若離此心復云何得為一切法體自答曰開合隨緣非即非離以緣會故合以緣散故開開合但緣卷舒無體緣但開合緣亦本空彼此無知能所俱寂故密嚴經偈曰譬如金石等本來無水相與水共和合若水而流動藏識亦如是體非流動流諸識共相應與法同流轉如鐵因磁石周回而轉移二俱無有思狀若有思覺賴耶與七識當知亦復然習繩之所繫無人而若有普遍衆生身周行諸陰趣如鐵與磁石展轉不相知豫嘗諦觀一切衆生迷於動轉遷移之中生心執著以為實然以是橫計有生有死罪行福行如嬰兒自旋見屋廬轉諸佛大悲為作方便以無情之類無有心念而亦有遷流為譬識心本來自寂即入無生大解脫門潭州道吾山有湫毒龍所蟄墮葉觸波必雷雨連日過者不敢喘慈明與泉大道同游泉牽其衣曰可同浴慈明掣肘徑去泉解衣躍入霹靂隨至腥風吹雨林木掀播慈明蹲草中大驚意泉死矣須臾晴霽忽引頸出波間笑呼曰㘞又嘗夜坐融峰頂有大蟒繞盤之泉解衣帶縛其腰中夜不見邌明䇿杖遍山尋之帶纏枯松之上蓋松妖也又自後洞負一石羅漢像至南臺像無慮數百斤衆僧驚駭莫知其來後洞僧亦莫知其去遂相傳至今號飛來羅漢又過衡山縣見屠者斫肉立其旁作可憐之態指其肉又指其口屠問曰汝啞耶即點頭屠大憐之割巨臠置鉢中泉喜出其望外連呼曰感謝市人皆笑泉自若而去後住南嶽芭蕉菴遭橫逆民其衣役郴州牢城盛暑負土𡎺城經通衢弛擔而坐觀者如堵說偈曰今朝六月六谷泉受罪足不是上天堂便是入地獄言訖微笑而寂異香郁然郴人至今供事之泉親見汾州無德禪師南山清源道人謂豫曰我十餘年作老黃龍侍者聞其說見慈明事甚詳嘗喟然嘆曰我平生不得谷泉文悅又爭識得慈明靈源禪師謂豫曰道人保養如人病須服藥藥之靈驗易見要須忌口乃可不然服藥何益生死是大病佛祖言教是良藥染污心是雜毒不能忌之生死之病無時而損也豫愛其言追念圓覺經曰末世諸衆生心不生虗妄佛說如是人現世即菩薩法華經曰若起精進心是妄非精進但能心不妄精進無有涯南嶽思大禪師悟入法華三昧即誦曰是真精進是名真法供養汾陽無業大達國師一生答學者之問但曰莫妄想是謂稱性之語見道徑門而禪者易其言反求玄妙可笑也三祖信心銘志公十二時歌永嘉證道文禪者不可不誦退之見大顛事傅大士四相頌雖不言於宗門何傷乎定上座不知何許人臨濟會中號稱龍象初至臨濟問如何是祖師西來意臨濟下座搊住曰速道速道定擬議濟掌之輒推去傍僧呼曰何不禮拜定拜起汗如雨因大悟巖頭雪峰欽山三人往河北道逢定鎮府來問曰臨濟和尚健否定曰已化去也相顧嘆息又問有何言句示衆定曰尋常上堂曰汝等諸人赤肉團上有一無位真人常自面門出入未證據者看欽山曰何不道赤肉團上非無位真人定忽擒住曰且道無位真人與非無位真人相去多少速道速道欽色動不能對巖頭雪峰勸解之定曰若不是這兩箇老凍醲𡎺殺尿床鬼子又過橋見三講人方論法義定倚杖聽之講者戲問曰禪者如何是禪河窮到底定捉住欲拋置水中兩講人驚抱持之哀告定曰若不是汝輩且教這漢窮到底臨濟宗旨貴直下便見不復留情定公所用舒卷自在如明珠走盤不留影迹可畏仰哉南禪師居積翠時有僧侍立顧視久之問曰百千三昧無量妙門作一句說與汝汝還信不對曰和尚誠言安敢不信南公指其左曰過這邊來僧將趨忽咄之曰隨聲逐色有甚了期出去一僧知之即趨入南公理前語問之亦對曰安敢不信南公又指其左曰過這邊來僧堅不往又咄之曰汝來親近我反不聽我語出去其門風壁立雖佛祖亦將喪氣故能起臨濟已墜之道而今人誣其家風但是平實商量可笑也子常愛王梵志詩云梵志翻著襪人皆謂是錯寧可刺你眼不可隱我腳寒山子詩云人是黑頭蟲剛作千年調鑄鐵作門限鬼見拍手笑道人自觀行處又觀世間當如是游戲耳淨業障經曰世尊謂無垢光曰寢夢犯欲本無差別一切諸法本性清淨然諸凡夫愚小無智於無有法不知如故妄生分別以分別故墮三惡道古佛同聲說偈曰諸法同鏡像亦如水中月凡夫愚惑心分別癡恚愛諸法常無相寂靜無根本無邊不可取欲性亦如是然教乘所論開遮不一故曰九結十纏性雖空寂初心學者且須離之是以諸佛所說深經先誡不可於新發意菩薩說慮種子習重發起現行又為觀淺根浮信解不及故也道吾真禪師孤硬具大知見與楊岐會禪師俱有重名於禪林當時慈明會中先數會真二大士為龍象然開法皆遠方小剎衆才二十餘輩諸方來者必勘驗之往往望崖而退甚多真臥病院主問和尚近日尊候如何答曰粥飯頭不得氣力良久曰會麼對曰不會曰猫兒尾後帶研槌或問如何是佛答曰洞庭無蓋豫作偈曰洞庭無蓋凍殺法身趙州貪食牙齒生津翠嵓真點胸英氣逸群不虗許可嘗客南昌章江寺長老政公亦嗣慈明性喜講說學者多尚義學真一日見政則以手摳其衣露兩脛緩步而過政怪問之對曰前廊後架皆是葛藤正恐絆倒耳政為大笑又問曰真兄我與你同參何得見人便罵我真熟視曰我豈罵汝吾畜一喙準備罵佛罵祖汝何預哉政無如之何而去見南禪師曰我他日十字街頭做箇粥主人有僧自黃蘗來我必勘之南公曰何必他日我作黃蘗僧汝今試問真便問近離什麼處曰黃蘗真曰見說堂頭老子腳跟不點地是否曰上座何處得這消息來真曰有人傳至南公笑曰却是汝腳跟不點地真亦大笑而去好問學者魯祖當日見來參者何故便面壁去未有契其機者自作偈曰坐斷千山與萬山勸人除却是非難池陽近日無消息果中當年不自觀衡嶽楚雲上人生唐末有至行嘗刺血寫妙法蓮華經一部長七寸廣四寸而厚半之作栴檀匣藏於福嚴三生藏又刻八字於其上曰若開此經誓同慈氏皇祐間有貴人遊山見之疑其妄使人以鉗發之有血如線出焉須臾風雷震山谷煙雲入屋相捉不相見彌日不止貴人大驚投誠懺悔嗟乎願力所持乃爾異也豫嘗經游往頂戴之細看血線依然貫休有詩贈之曰剔皮刺血誠何苦為寫靈山九會文十指瀝乾終七軸後來求法更無君永明和尚曰今之學者多好求解會此豈究竟解但為遣情耳說但為破執耳情消執盡則說解何存真性了然寂無存泯所以若言即與不即皆落是非瞥掛有無即非正念故三祖大師云才有是非紛然失心時有僧問凡涉有無皆成邪念若關能所悉墮有無如何是正念而知答曰瑞草生嘉運林華結早春此是禪宗之妙於諸方便中最為親語白雲端禪師作蠅子透窗偈曰為愛尋光紙上鑽不能透處幾多難忽然撞著來時路始覺平生被眼瞞作北斗藏身因緣偈曰五陵公子游花慣未第貧儒自古多冷地看他人富貴等間不奈幞頭何豫謂此老筆端有口故多說少說皆無剩語道宣律師作二祖傳曰可遇賊斫臂以法御心初無痛苦蜀僧神清引其說以左書豫讀之每失笑且嘆宣暗於辨是非也既列林法師與二祖聯傳於林傳則曰林遇賊斫臂呼號不已故人呼為無臂林林與二祖友善一日同怪其亦以一手進問其故對曰我無臂舊矣豈有游從之人為賊斫臂久而不知反相問者耶夫二祖以求法故世無知者林公以遇賊故人皆知之宣雷同之辱誣先聖過矣彼神清何為者也據以為書又可以發一笑雖然孟子曰盡信書不如無書學者亦可以鑒於此慈明老人性豪逸忽繩墨凡聖莫測初弃南源歸省其母以銀盆為之壽其母投諸地罵曰汝少行腳負布橐去今安得此物吾望汝濟我今反欲置我作地獄滓耶慈明色不怍徐收之辭去謁神鼎諲公師叔諲公首山之子望高叢林住山三十年影不出山諸方莫有當其意者慈明通謁稱法姪一衆大笑諲公使人問長老何人之嗣對曰親見汾陽來諲訝之出與語應答如流大奇之會道吾虗席郡移書欲得大禪伯領之諲以慈明應召湘中衲子聞其名聚觀之豫謂慈明道起臨濟於將仆而平昔廓落乃如此微神鼎則殆亦谷泉之流也然至人示現要非有思議心所能知也教中有女子出定因緣叢林商略甚衆自非道眼明白親見作家莫能明也大愚芝禪師每問僧曰文殊是七佛之師為什麼出此女子定不得罔明菩薩下方而至但彈指一聲便能出定莫有對者乃自對曰僧投寺裏宿賊入不慎家豫滋愛其語作偈記之曰出定只消彈指佛法豈用工夫我今要用便用不管罔明文殊雲菴和尚見之明日升座用前話乃曰文殊與罔明見處有優劣也無若言無文殊何故出女子定不得只如今日行者擊動法鼓大衆同到座前與罔明出女子定是同是別良久曰不見道欲識佛性義當觀時節因緣亦有偈曰佛性天真事誰云別有師罔明彈指處女子出禪時不費纖毫力何曾動所思衆生總平等日用自多疑大愚芝禪師作偈絶精峭豫猶及見老成多誦之其作僧問洞山如何是佛答云麻三斤偈曰橫眸讀梵字彈舌念真言吹火長尖嘴柴生滿竈烟又作雲門普字偈曰說佛說法廣鋪舒矢上加尖也太愚明眼衲僧傍覷見一條拄杖兩人舁又示衆曰沙裏無油事可哀翠嵓嚼飯餵嬰孩他時好惡知端的始覺從前滿面灰李留後端願問達觀禪師曰人死識當何所歸答曰未知生焉知死對曰生則端願已知曰生從何來李留後擬議達觀揕其胸曰只在這裏思量箇什麼對曰會也只知貪程不覺蹉路達觀拓開曰百年一夢又問地獄畢竟是有是無答曰諸佛向無中說有眼見空華太尉就有中覔無手𢳛水月堪笑眼前見牢獄不避心外見天堂欲生殊不知欣怖在心善惡成境太尉但了自心自然無惑進曰心如何了答曰善惡都莫思量又問不思量後心歸何所達觀曰且請太尉歸宅住潤州浮玉山禪者景向嘉祐五年正月元日登堂敘出世始末大衆悲戀下座入方丈趺坐衆復擁至以手揮曰各就壁立勿譁少頃寂然而逝豫讀大宋僧史會要愛隋大臣楊公素識度明正嘗游嵩山見𦘕壁指問道士曰此何像對曰老子化胡成佛圖楊公曰何不化胡成道而反成佛耶道士不能答傳以為名言雪竇通禪師長沙岑大蟲之子也每謂諸同伴曰但時中常在識盡功成瞥然而起即是傷他而況言句乎故石霜諸禪師宗風多論內紹外紹臣種王種借句挾帶直饒未嘗忘照猶為外紹謂之臣種亦謂之借謂之誕生然不若絲毫不隔如王子生下即能紹種謂之內紹謂之王種謂之句非借也借之為言一色邊事耳不得已應機利生則成挾帶汾陽無德禪師偈曰士庶公侯一道看貧富賢愚名漸次將知修行亦須具眼豫參至此每自嗟笑嗟堂中首座昧先師之意而脫去笑羅山大師不契而識巖頭及觀棗柏大士之論曰當以止觀力功熟乃證知急亦不得成而緩亦不得但知常不休必定不虗弃如乳中有酪要須待其緣彼緣緣之中本無有作者故其酪成已亦無有來處亦非是本有如來智慧海方便亦如是是以知古老宿行處皆聖賢之言也幽州盤山積禪師有言曰似地擎山不知山之孤峻如石含玉不知玉之無瑕若能如是是真出家大法眼禪師曰理極亡情謂如何有喻齊到頭霜夜月任運落前溪果熟兼猿重山長似路迷舉頭殘照在元是住居西邃導師曰老僧平生百無所解只是日日一般雖住此間隨緣任運今日諸上座與本無異也古之人有大機智故能遇緣即宗隨處作主巖頭和尚曰汝但識綱宗本無是法豫嘗與客論靈雲見桃華偈曰三十年來尋劒客幾回葉落又抽枝自從一見桃花後直至如今更不疑溈山老子無大人相便云從緣入者永無退失獨玄沙曰諦當甚諦當敢保老兄猶未徹在客問豫未徹之處安在哉為作偈曰靈雲一見不再見紅白枝枝不著花叵耐釣魚船上客却來平地摝魚蝦五祖戒禪師喜勘驗衲子時大嶽雪竇號為飽參且有機辨至東山之下雪竇令大嶽先往嶽包腰徑入方丈時戒歸自外見之呼云作什麼嶽回首以手畫圓相示之戒曰是什麼嶽曰胡餅戒曰趂爐竈熱更搭一箇嶽擬議曳拄杖趂出門嶽曰顯川這關西子無面目休去好戒暮年弃其徒來游高安洞山寶禪師其法嗣也寶好名賣之不為禮至大愚未幾倚拄杖於僧堂前談笑而化五祖遣人來取骨石歸塔焉溈山大圓禪師曰道人之心質直無僞無背無面無詐妄心一切時中視聽尋常更無委曲亦不閉眼塞耳但情無附物即得從上諸聖只是說濁邊過患若無如許多惡覺情見想習之事譬如秋水澄渟清淨無為淡佇無礙喚作道人亦名無事人或問頓悟之人更用修否曰若真實悟得底他自知時節修與不修是兩頭語今雖從緣得一念頓悟自理猶有無始習氣未能頓淨須教渠淨除現業流識即是修也不可別有一法教渠修行趣向從聞入理聞理深妙心自圓明不居惑地縱有百千妙義抑揚當時此乃得坐披衣自解作活計始得以要言之則實際理地不受一塵萬行門中不捨一法若也單刀直入則凡聖情盡體露真常理事不二即如如佛今時學者常疑佛性本來具足何須復修設不修行無緣證聖情隨向背終落斷常不知三世如來十方菩薩所有修習皆自隨順覺性而已則大溈所謂修與不修是兩頭語不亦宜乎法眼禪師之子有慧明道人者知見甚高下視諸方初菴於大梅山有禪者來游明問曰近離何處對曰城都曰上座離城都到此山則城都少上座此山剩上座剩則心外有法少則心法不周說得道理即住不會即去禪者莫能對又遷止天台山有彥明道人者俊辨自負來謁師師問曰從上先德有悟者麼對曰有之曰一人發真歸源十方虗空悉皆消殞舉手指曰只今天台山嶷然如何得消殞去明張目直視遁去又問諸老宿曰雪峰塔銘曰夫從緣而有者始終而成壞非從緣而有者歷劫而長堅堅之與壞即且止雪峰只今在什麼處豫謂禪宗貴大機大用不貴知解雲庵每曰汝輩皆知有只是用不得如慧明道人可謂善用者也豫讀傳燈録愛老安之子所謂破竈墮者深證無生恨不與之同時而生也紹聖中再游廬山見其𦘕像為作贊曰嵩山屋老竈有神民爭祠之日宰烹師與門人偶經行即而視之因嘆驚此唯土瓦和合成是中何從有聖靈以杖敲之輒墮傾須臾青衣出笑迎謝師為我談無生言訖登空如鳥輕門人問之拜投誠伏地但聞破墮聲君看一躰情非情皎如朗月懸青冥未證據者以事明鞭草血流石吼升涅槃門開見戶庭老安憐兒為作名金屑雖貴翳眼睛金華懷志上座性夷粹飽經論東吳學者尊事之嘗對客曰吾欲會天台賢首唯識三宗之義折中之為一書以塞影迹之諍適有禪者居坐末曰賢首宗祖師謂誰志曰杜順和尚禪者曰順有法身頌曰懷州牛喫禾益州馬腹脹天下覔醫人灸猪左膊上此義合歸天台唯識二宗何義耶志不能對禪者曰何不游方去志於是罷講南詢至洞山時雲菴和尚在焉從之游甚久去游湘上菴於石頭雲溪二十餘年氣韻間淡過客謁之多不言侍者問之答曰彼朝貴人多知多語我粥僧見之自然口吻遲鈍去僧問住山有何趣味答曰山中住獨掩柴門無別趣三箇柴頭品字煨不用援毫文彩露又曰萬機俱罷付癡憨蹤迹常容野鹿參不脫麻衣拳作枕幾生夢在緑蘿庵年六十二思歸江南依故人照禪師照住龍安遂徑去豫嘗作偈寄之曰看遍三湘萬頃山江南歸去臥龍安只將一味無求法留與叢林作㨾看又曰閙中拋擲亦奇哉句裏藏身活路開生鐵心肝含笑面不虗參見作家來杭州上天竺辨才法師元淨悟法華三昧有至行弘天台教號稱第一東吳講者宗向之時秀州有狂人號回頭左道以鼓流俗宣言當建窣堵波為吳人福田施者雲委然憚入杭境以辨才不可欺故也不得已既來先以錢十萬詣上天竺飯僧且遣使通問曰今以修造錢若干願供僧一堂淨答其書曰道風遠來山川增勝誨言先至喜慰可量承以營建淨檀為飯僧之用竊聞教有明文不許互用聖者既遺明誨不知白佛當以何辭佇聞報章即令撰疏文也狂人大驚慚見其徒然淨之門弟子亦勸且禮之以化俗淨厲語曰出家兒須具眼始得彼誠聖者吾敢不恭如其誕妄知而同之是失正念吾聞聖者俱他心通今夕當與爾曹䖍請於明日就此山與十方諸佛同齊即如法嚴敬跪讀疏文焚之明日率衆出迎而所謂狂人者竟不至學者皆服汾陽無德禪師見七十一員善知識前後八請皆不出世燕居襄陽白馬寺并汾道俗千餘人詣其居勸請說法既至宗風大振迹不越閫自為不出院歌以見志北地苦寒因罷夜參忽有梵僧乘雲而至問所以不說之意師以衆僧不可夜立為詞梵僧曰時不可失此衆雖不多然中有六人異日為大宗師道廕人天可開大慈為法施不可吝也言卒而沒師明日上堂曰胡僧金錫光為法到汾陽六人成大器勸請為敷揚時大愚芝石霜圓琅瑘覺法華舉諸公咸在會下永嘉禪師偈曰若以知知寂此非無緣知如手執如意非無如意手若以自知知亦非無緣知如手自捉拳非是不拳手亦不知知寂亦不自知知不可為無知以性了然故不同於木石如手不執物亦不自作拳不可為無手以手安然故不同於兔角智覺禪師曰斯為禪宗之妙故今用之而復小異以彼但顯無緣真智以為真道若奪之者但顯本心不隨妄心未有智慧照了心源故須能所平等等不失照為無知之知此知之於空寂無生如來藏性方有妙耳智覺之意欲偈兼言明悟永嘉止說悟後之病二老之言皆是也然天下之理豈可以一言盡耶永嘉之偈不必奪亦可也正宗記評三祖大師曰尊者初雖不自道其姓族鄉邑後之於世復三十餘載豈絶口而略不云乎此可疑也曰豫視房曰大師嘗謂道信云有人借問勿道於我處得法此明尊者自絶之甚也至人以物迹為大道之纍乃忘其心今正法之宗猶欲遺之況其姓族鄉國俗間之事肯以為意耶豫讀至此知明教所得多矣王文公亦曰古之有道者功業有不足以纍其懷況身後之名乎如亮公之逃西山常公之菴大梅歸宗之眯其目法正之不言名姓是諸老皆能踐其所聞者也故其化去數百年凜凜尚有生氣彼無意於此世爭以此與之蓋理之固然南禪師住歸宗時遣化至䖍上化人還白曰虔有信士劉君臨行送至郊外祝曰為我求老師偈一首為子孫世世福田明年師以偈寄之曰虔上僧歸廬嶽寺首言居士乞伽陀援毫示汝箇中意近日秋林落葉多後四十年雲菴復住歸宗法席盛於前日劉君之子持此偈來僧敘其事雲菴上堂有偈曰先師昔住金輪日有偈君家結淨緣我住金輪還有偈却應留與子孫傳涅槃經中有聞讚佛為大福德怒曰生經七日母便命終豈謂大福德相讚者曰年志俱盛而不卒暴打之不嗔罵之不報是故我言大福德相怒者聞而心服故慈為無盡福德相故沙門能世福田者以慈修身故也永明和尚曰此重玄門名言路絶隨智所演以廣見聞唯證方知非情所解若親證時悉是現量之境處處入法界念念見遮那若但隨文義所解只是陰識依通當逆順境時還成滯礙遇差別問處皆是疑情如鹽官安禪師問講華嚴大師云華嚴經有幾種法界對曰略而言之有十種法界廣而言之重重無盡鹽官舉拂子云是第幾重法界大師俯首擬答之鹽官訶曰思而知慮而解是鬼家活計日下孤燈果然失照出去豫聞華嚴宗曰勝熱婆羅門火聚刀山是般若無分別智彼疏義者如葉公𦘕龍真龍忽見投筆怖走洞山圓禪師嗣雪竇年甚少開先暹道者舉之以應筠人之請時南禪師住黃檗因出邑相見於淨戒寺南公默無所言但焚香相向危坐而已自申時至三鼓圓公即起曰夜深妨和尚偃息趍出明日各還山南公偶問永首座汝在廬山識今洞山老否永曰不識止聞其名久之進曰和尚此回見之如何人南公曰奇人永退問侍者汝隨和尚見洞山夜語及何事侍者以實告永笑曰疑殺天下人志公和尚十二時歌大明佛祖要妙然年代寢遠昧者多改易其語以循其私其大害意者如曰夜半子心住無生即生死心法何曾屬有無用時便用沒文字乃作生死何曾屬有無言則工矣然下句血脉不貫既曰生死不屬有無又曰用時便用何哉豫在湘山道林有僧謂豫曰吾初看六祖風幡因緣久之偶仰首就架取衣方薦其旨豫戲曰非舉目見風幡時節耶僧首肯之豫曰祖師夜聞二僧徵詰即謂曰非風幡動仁者心動縱其張目於暗中二僧何以識之僧大慍而去無盡居士嘗為豫言頃京師見慧林一僧談禪不肯諸方吾問蜆子答祖師西來意乃曰神前酒臺盤意旨如何其僧張目直視曰神前酒臺盤無盡戲之曰廟中是夕有燈則已不然蜆子佛法遂為虗施靈源禪師謂豫曰吾嘗在龍舒見龍門顯道人發課莫有能逃其言者意有必道顯曰但有所見即道微入思惟即不靈矣豫故人耶溪鄒正臣能言五行其精妙世以一二數亦嘗告豫以此意彼術之至者且爾況有大於此者而欲以思慮求乎鄧峰永庵主嘗問僧審奇汝久不見何所為奇曰近見偉藏主有箇安樂處永曰試舉似我奇因敘其所得永曰汝是偉未是奇莫測歸語于偉偉大笑曰汝非永不非也奇走質於積翠南禪師南公亦大笑永聞之作偈曰明暗相參殺活機大人境界普賢知同條生不同條死笑倒庵中老古錐觀其語言想見當時法喜游戲之逸韻使永公施於今則其取詬辱必矣臨濟大師臨終付法偈曰㳂流不止問如何真照無邊說似他離相離名如不稟吹毛用了急須磨而傳者作急還磨曹山和尚釋枯木龍吟髑髏無識語作偈曰枯木龍吟方見道髑髏無識眼方明喜識盡時消息盡當人那辨濁中清而傳者作消不盡二宗兩偈甚微而一失其旨則為害甚大故不可不辨所言用了急須磨者船子曰直須藏身處沒蹤跡沒蹤跡處莫藏身是也喜識盡時消息盡當人那辨濁中清者達觀所謂偏正㸦縱橫迢然忌十成龍門須要透鳥道不堪行石女霜中織泥牛火裏耕兩頭如脫得枯木一枝榮是也無盡居士嘗問豫曰悟本大師作五位君臣偈其正中來曰但能莫觸當今諱也勝知朝斷舌才先德之意雖明妙挾然知朝斷舌必有本據而言前古無斷舌事矧又曰知朝尤無謂也將非後世傳録之誤耶豫曰舊本曰也勝前朝斷舌才意用隋賀若弼之父孰為宇文護所忌害之臨刑戒之曰吾以舌死引若弼舌以錐刺之出血使慎口隋興唐之前前朝刺舌非知朝明矣然斷舌刺舌意則同耳無盡屬豫記之道圓禪師南雄州人姓純至小游方雖飽參而未大通透聞南禪師居黃蘗積翠庵往依之一日燕坐下板聞兩僧舉百丈野狐因緣一僧曰只如不昧因果也未脫得野狐身一僧應聲曰便是不落因果亦何曾墮野狐身耶圓悚然異其語不自覺其身之起意行上庵頭過㵎忽大悟見南公敘其事未終涕交南公令就侍者榻熟寐忽起作偈曰不落不昧僧俗本無忌諱丈夫氣宇如王爭受囊藏被蓋一條楖𣗖任縱橫野狐跳入金毛隊南公大笑久之又作風幡偈曰不是風兮不是幡白雲依舊覆青山年來老大渾無力偷得忙中些子間豫昔聞雲菴大稱賞之謂其機鋒不減英邵武雲庵化去偶檢故書見其手疏此二偈意若欲傳而未果者於是録之或聞圓公住大庾雪峰寺皓月供奉問長沙岑禪師曰永嘉云了即業障本來空未了應須償夙債只如師子尊者二祖大師為什麼亦償夙債長沙曰大德不識本來空曰如何是本來空長沙曰業障是又問曰如何是業障長沙曰本來空是乃有偈曰假有元非有假滅亦非無涅槃償債義一性更無殊龍勝中觀論曰業不從緣生不從非緣生是故則無有能起於業者無業無作者何有業生果若其無有果何有受業者問曰汝雖種種破業果報及起業者現見衆生作業受果報是事云何答曰如世尊神通所作變化人如是變化人復作變化人如初變化人是名為作者變化人所作是則名為業諸煩惱及業皆如幻與夢亦如炎與響以龍勝之意會長沙之言達無作妙旨游此世界如夢中了了醉裏惺惺汾州無德禪師示徒多談洞山五位臨濟三玄至作廣智歌明十五家宗風豈非視後進惰於參尋得少為足警之以遍參耶今有問知識者則答曰吾家自有本分事彼皆古人一期建立門庭言語耳何足究哉正如有不識字者執卷問屋愚子屋愚曰此墨填紙耳安用問我哉三尺童子莫不笑之昔有僧問雪峰和尚臨濟有四喝意旨如何雪峰曰我初發足便往河北不意中途大師化去因不及見之他家宗旨我所未知汝尋彼兒孫問之僧以問南院且言雪峰嘗遣之之意南院望雪峰再拜曰和尚真善知識嗚呼今譊譊語人如屋愚子者聞雪峰用處可不面熱汗下耶雲峰悅禪師見僧荷籠至則曰未也更三十年定乘馬行腳法雲秀禪師聞包腰至者色動顏面彼存心於叢林豈淺淺哉今少年苾芻見其𦘕像則指曰這不通方漢也死耶首楞嚴經曰一切世間生死相續生從順習死從流變臨命終時未捨暖觸一生善惡俱時頓現古釋至此多略之滋以為恨及讀寶積經有意釋此今系於其下曰善惡之業所自作時一生之中何不自見至捨壽時方始頓現者人生如夢方作夢時豈能自知是夢非夢要須覺時夢中之事了然自現不待尋繹亦復如是福嚴感禪師面目嚴冷孤硬秀出叢林時謂之感鐵面首衆僧於江州承天時佛印元禪師將遷居蘄州斗方譽於郡守欲使嗣續之且召感語其事感曰某念不至此和尚終欲推出為衆粥飯主人共成叢席不敢忘德然若使嗣法則某自有師矣佛印心服之業已言之因成就不復易遂開法為黃龍之子道價重一時居常懸包倚杖於方丈不為宿夕計郡將已下皆信敬之有太守忘其姓名新下車以事臨之感笑作偈投郡庭不揖而去偈曰院是大宋國裏院州是大宋國裏州州中有院不容住何妨一鉢五湖游太守使人追之已渡江去矣餘杭政禪師住山標致最高時蔣侍郎堂守錢塘與師為方外友師每來謁之則跨一黃牛以軍持掛角上市人爭觀之師自若也至郡庭始下牛笑語終日而去一日蔣公留師曰適有過客明日府中當有會吾師固不飲能為我少留一日因欲清話師諾之蔣公喜甚明日使人要之留一偈而去矣曰昨日曾將今日期出門倚杖又思惟為僧只合居嵓谷國士筵中甚不宜坐客皆仰其高韻又作山中偈曰橋上山萬層橋下水千里唯有白鷺鷀見我常來此冬不擁爐以荻花作毬納足於中客至共之清論無窮秀氣逼人秋夏好玩月盤膝大盆中浮於池上自旋其盆吟笑達旦率以為常九峰鑒韶禪師嘗客門下韶坦率垢汙不事事每竊笑之一夕將臥師使人呼韶不得已顰頞而至師曰好月勞生擾擾能幾人暇與之對耶韶唯唯已而呼行者熟炙韶方飢意作藥石久之乃橘皮湯一杯靈源禪師為豫曰有居士吳敦夫才敏鋭意學道自以多見知識心地明淨偶閲鄧隱峰傳見其倒卓化去而衣亦順身不褪竊疑之曰彼化之異固莫測而衣亦隨之何也以問晦堂老人晦堂曰汝今衣順垂于地復疑之乎曰無所疑也晦堂笑曰此既無疑則彼倒化衣亦順躰何疑之有哉敦夫言下了解故其一時應機之辨如雷如霆開警昏蟄者多矣金剛經曰爾時慧命須菩提白佛言世尊頗有衆生於未來世聞說是法生信心不佛言須菩提彼非衆生非不衆生何以故須菩提衆生衆生者如來說非衆生是名衆生此義深渺從上聖賢語祕旨妙學者多聽瑩佛意卒不明獨定林老人解曰以慧命觀衆生如第五大如第六陰如第七情孰為衆生以衆生觀衆生然後妄見其為有則衆生非慧命者之衆生是衆生之衆生而已衆生衆生者即非衆生然是乃所謂衆生也則聞說是法苟能悟本性相何為不生信心以慧命觀衆生不見其為有則云何度衆生耶曰衆生有衆生而衆生非有慧命無衆生而衆生非無以是義故度衆生大智禪師曰此事不是一切名目何以不以實語答耶曰若為雕琢得虗空為佛相㒵若為說道虗空是青黃赤白如維摩云法無有比無可喻故法身無為不墮諸數故故曰聖躰無名不可說如實理空門難湊喻如太末蟲處處能泊唯不能泊火焰之上衆生亦爾處處能緣不能緣於般若之上每見學者多誤領其意謂衆生於般若不能參求耳非也此法非情識所到故三祖大師曰非思量處識情難測青龍道氤法師於金剛般若經深達妙旨嘗造疏疏此經精博淵微窮法體相諸師莫能望其藩垣唐明皇亦留意經義自注釋之至是人先世罪業應墮惡道以今世人輕賤故先世罪業則為消滅處不能自決其義以問氳氤對曰佛力法力三賢十聖亦不能測陛下曩於般若聞薰不一更沈注想自發現行明皇於是下筆不休其天縱神悟之辨一期應答掃滯惑於言下揭般若於現前豈意思義解之徒可同日而語哉雲門大師有時顧視僧曰鑒僧擬對之則曰咦後學録其語為偈曰顧鑒頌德山圓明禪師雲門之高弟也刪去顧字謂之抽顧頌因作偈通之又謂之擡箭商量偈曰相見不揚眉君東我亦西紅霞穿碧海白日繞須彌雲菴亦有偈曰雲門抽顧自有來由一點不到休休休休今禪者多漫汗之問其意旨則往往瞪目怒視曰此是道眼因緣也不亦誤哉又其室中語曰盡大地是法身枉作箇佛法知見如今見拄杖但喚作拄杖見屋但喚作屋而校證者易之曰枉作箇佛法中見又曰自小養一頭水牯牛擬向溪東放不免食他國王水草擬向溪西放不免食他國王水草不如隨處納些子他總不妨今本乃曰他總不見如此之類甚衆然此二字雖細事其失先德妙旨不為不傷當有知者耳英邵武臨終安坐為門弟子說出家行腳之因竟乃曰吾即化骨石可藏於普會塔吾生平與大海衆居死不忍與之離非有他也古之聖賢莫不因叢林以折伏情見成辦道果今時衲子德薄垢重志願衰劣多生厭退是大可憫笑也師既化衆終不忍不得已投於水中故泐潭今無復有英禪師塔舜老夫天資英特飽叢林初自棲賢移居雲居授牒升座白衆曳杖而去暮年以身律衆尤謹嚴嘗少不安即白維那下涅槃堂病愈即入方丈惜其傷慈有所開示但曰本自無事從我何求南禪師時已居積翠聞之謂侍者曰老夫耄矣何不有事令無事無事令有事是謂淨佛國土成就衆生三祖大師作信心銘曰至道無難唯嫌揀擇但莫憎愛洞然明白毫釐有差天地懸隔故知古之得道者莫不一切仍舊有僧問永明和尚衆生與佛既曰同體何故苦樂有殊答曰諸佛悟達法性皆了自心源妄想不生不失正念我所心滅故不受生死即究竟常寂滅以寂滅故乃樂自歸一切衆生迷於真性不達本心種種妄想不得正念故即憎愛以憎愛故心器破壞即受生死諸苦自現欲知法要守心第一若一人不守真心得成佛無有是處悅禪師妙年奇逸氣壓諸方至雪竇時壯歲與之辨論雪竇常下之每會茶必令特榻於其中以尊異之於是悅首座之聲價照映東吳及悅公出世道大光耀有蘭上座者自雪竇法窟來悅公勘詰之大驚且譽於衆相從彌年而後去前輩之推轂後進其公如此初未嘗以雲門臨濟二其心今則不然始以名位惑卒以宗黨膠固如里巷無知之俗欲求古聖之道復興不亦難哉舜老夫初自洞山如武昌行乞先至一居士家居士高行為郡所敬意所與奪莫不從之故諸方乞士至必首謁之舜老夫方年少不知其飽參頗易之居士曰老漢有一問上人語相契則開疏如不契即請却還新豐問古鏡已磨時如何對曰照天照地未磨時如何曰黑如漆居士曰却請還山舜即馳歸舉似聰禪師聰為代語舜即趍問曰古鏡未磨時如何聰曰此去漢陽不遠磨後如何曰黃鶴樓前鸚鵡洲舜於言下大悟聰公機鋒不可觸真雲門之孫嘗自植松口誦金剛經不輟今洞山北嶺號金剛嶺松皆參天乃師手植也筠守許公式以詩贈曰語言全不滯高躡祖師蹤夜坐連雲石春栽帶雨松鑑分金殿燭山答月樓鐘有問西來意虗堂對遠峰南禪師久依泐潭澄禪師澄已稱其悟解使分座說法南書記之名一時籍甚及其至慈明席下聞夜參氣已奪矣謀往咨詢三至寢堂三不進因慨然曰大丈夫有疑不斷欲何為乎即入室慈明呼左右使進榻且使坐南公曰某實有疑願投誠求決惟大慈悲故不惜法施慈明笑曰公已領衆行腳名傳諸方有未透處可以商略爾何必復入室耶南公再三懇求不已慈明曰雲門三頓棒因緣且道洞山當時實有喫棒分無喫棒分對曰實有喫棒分慈明曰書記解識止此老僧固可作汝師即遣禮拜南公平生所負至此伏膺豫嘗聞靈源禪師曰昔晦堂老人親從積翠所聞因同舊說併録於此福州善侍者慈明高弟當時龍象數道吾真楊歧會然皆推服之嘗至金鑾真點胸自負親見慈明天下莫有可意者善與語知其未徹笑之一日山行真舉論鋒發善取一瓦礫置石上曰若向者裏下得一轉語許你親見老師真左右視擬對之善喝曰佇思停機識情未透何曾夢見去真大愧悚且圖還霜華慈明見來曰本色行腳人必知時節有什麼忙事解夏未久早已至此對曰被善兄毒心終礙塞人故復來見和尚慈明曰如何是佛法大意對曰無雲生嶺上有月落波心慈明瞋目喝曰頭白齒豁猶作此等見解如何脫離生死真不敢仰視淚交久之進曰不知如何是佛法大意慈明曰無雲生嶺上有月落波心真大悟於言下真公爽氣逸出機辨迅捷叢林憚之開法於翠嵓嘗曰天下佛法如一隻船大寧寬師兄坐頭南褊頭在其中可真把梢去東也由我去西也由我善公尋還七閩佯狂垢污世莫有識之者或聞晚住鳳林楊岐會禪師從慈明游最久所至叢林師必作寺主慈明化去託迹九峰忽宜春移檄命居楊岐時長老勤公驚曰會監寺何曾參禪萬一受之恐失州郡之望私憂之會受請即升座機辨逸格一衆為傾下座勤前握其手曰且得箇同參曰如何是同參底事勤曰楊歧牽犂九峰拽把曰正當與麼時楊歧在前耶九峰在前耶勤擬議會喝曰將謂同參却不同參自是道價重諸方衲子過其門莫不伏膺嘗因雪示衆曰楊歧乍住屋壁踈滿床盡布雪真珠縮却項暗嗟吁翻憶古人樹下居其活計風味類如此仰山和尚僧聞尋常和尚示人多作圓相畫作字意旨如何山曰此亦間事汝若會不從外來不會亦不失吾今問汝汝參禪學道諸方老宿向汝身上指那箇是汝佛性語底是耶默底是耶總是總不是耶若認語底是如盲摸著象耳鼻牙者若認默底是耶是無思無念如摸象尾者若取不語不默底是中道如摸象背者若道總是如摸象四足者若道總不是拖本象落在空見正當諸盲皆云見象安知止於象上名邈差別耶若汝透得六句不要摸象最為第一莫道如今鑒覺是亦莫道不是所以祖師曰菩提本無是亦無非菩提更覔菩提處終身纍劫迷又曰本來無一物何處有塵埃其弟香嚴老亦曰的的無兼帶獨立何依賴路逢達道人莫將語默對豫嘗問僧既不將語默對何以對之僧未及答忽板鳴豫曰謝子答話龍勝菩薩曰若使先有生後有老死者不老死有生生不有老死若使有老死而後有生者是則為無因不生有老死以此偈觀衆生生死之際如環上尋始末無有是處吾以是知古之得此意於去住之間了不留礙者特其不二於物耳維摩經曰善來文殊師利不來相而來不見相而見文殊師利言如是居士若來已更不來若去已更不去所以者何來者無所從來去者無所至所可見者更不可見起信論曰若心有見則有不見之相心性離見即是遍照法界義故乃知心外無法遍照義成苟有去來相見則遺正義也如人言風性本動是大不然風本不動能動諸物若先有動則失自躰不復更動則知動者乃所以明其未嘗動也去來相見亦復如是洞山聰禪師韶之曲江人見文殊應天真和尚初游廬山莫有知之者時雲居法席最盛師作燈頭聞僧衆談泗州僧伽近於楊州出現有設問者曰既是泗州大聖為什麼向楊州出現聰曰君子愛財取之有道一衆大笑有僧至蓮華峰祥菴主所舉似之祥公大驚曰雲門兒孫猶在中夜望雲居拜之聰之名遂重叢林祥公奉先深禪師之嗣知見甚高氣壓諸方嘗示衆曰若是此事最是急切須是明取始得若是明得時中免被拘繫便得隨處安間亦不要將心捺伏須是自然合他古轍去始得才到學處分劑便須露布箇道理以為佛法幾時得心地休歇去上座却請與麼相委好臨終上堂舉拄杖問衆曰汝道古佛到這裏為什麼不肯住衆莫有對者乃自曰為他途路不得力復曰作麼生得力去橫拄杖肩上曰楖𣗖橫擔不顧人却入千峰萬峰去言訖而化嗟乎今之學者其識趣與前輩何其相遠耶如祥公聞聰燈頭一語知其為雲門兒孫其後莫能逃其言今雖對面終身論辨莫辨邪正者有矣其故何哉以其臨死生之際超然自得如此則其平生所養高妙可知惜乎莫有嗣之者師與西峰雲豁禪師兄弟也百丈山第二代法正禪師大智之高弟其先嘗誦涅槃經不言姓名時呼為涅槃和尚住成法席師功最多使衆開田方說大義者乃師也黃蘗古靈諸大士皆推尊之唐文人武翊黃撰其甚詳柳公權書妙絶古今而傳燈所載百丈惟政禪師又係於馬祖法嗣之列誤矣及觀正宗記則有惟政法正然百丈第代可數明教但皆見其名不能辨而俱存也今當以柳為正古佛偈曰如人掘路土私人造為像愚人謂像生智者言路土後時官欲行還將像填路像本無生滅路亦非新故又偈曰諸色心現時如金銀隱起金處異名生與金無前後故文殊師利言此會諸善事從本未曾為一切法亦然悉等於前際所以正作時無作以無作者故當為時不為以無自性故任從萬法縱橫常等無生之際乃知磁石決不吸鐵無明不緣諸行龐公臨終偈曰空花落影陽焰翻波永明和尚嘆味其言曰此為不墮有無之見妙得無生之旨也學者可深觀之大智度論曰復次有人謂地為堅牢心無形質皆是虗妄以是故佛說心力為大行般若波羅蜜故散此大地以為微塵以地有色香味觸重故自無所作水少香故動作勝地火少香味故勢勝於水風少色香味故動作勝火心無四事故所為力大又以心多煩惱結使繫縛故令心力少有漏善心雖無煩惱以心取諸法相故其力亦少二乘無漏心雖不取相以智慧有量及出無漏道時六情隨俗分別取諸法相故不盡心力諸佛及大菩薩智慧無量無邊常處禪定於世間涅槃無所分別諸法實相其實不異但智有優劣行般若波羅蜜者究竟清淨無所礙一念中能散十方一切如恆河沙等三千大千國土大地諸山微塵故知其心有此大力衆生妄隔而不自覺知我願聞此法者隨順禪定而自修行使稱覺體本來清淨此非興役功用之難第約之心耳今家山遍十方衣食可終老人生可憂者皆已免離於此不以為意則非背負佛祖恩德乎景福順禪師西蜀人有遠識為人勤渠叢林後進皆母德之得法於老黃龍昔出蜀與圓通訥偕行已而又與大覺璉游甚久有贊其像者曰與訥偕行與璉偕處得法於南為南長子然緣薄所居皆遠方小剎學者過其門莫能識師亦超然自樂視世境如飛埃過目壽八十餘坐脫於香城山顏貌如生平生與潘廷之善將終使人要延之敘別延之至而師去矣其示衆多為偈皆德言也有偈曰夏日人人把扇搖冬來以炭滿爐燒若能於此全知曉塵劫無明當下消又作趙州勘婆偈曰趙州問路婆子答云直與麼去皆云勘破老婆婆子無你雪處同道者相共舉又作黃龍三關頌曰長江雲散水滔滔忽爾狂風浪便高不識漁家玄妙意偏於浪裏颭風濤又曰南海波斯入大唐有人別寶便商量或時遇賤或時貴日到西峰影漸長又曰黃龍老和尚有箇生緣語山僧承嗣伊今日為君舉為君舉猫兒偏解捉老鼠朱顯謨世英昔官南昌識雲庵未幾移漕江東以書來問佛法大旨雲庵答之曰辱書以佛法為問佛法至妙無二但未至於妙則㸦有長短苟至於妙則悟心之人如實知自心究竟本來成佛如實自在如實安樂如實解脫如實清淨而日用唯用自心自心變化把得便用莫問是非擬心思量已不是也不擬心一一天真一一明妙一一如蓮華不著水所以迷自心故作衆生悟自心故成佛而衆生即佛佛即衆生由迷悟故有彼此也如今學者多不信自心不悟自心不得自心明妙受用不得自心安樂解脫心外妄有禪道妄立奇特妄生取捨縱修行落外道二乘禪寂斷見境界雲菴之言蓋救一時之弊然其旨要曉然可以發人之昧昧故私識之大本禪師被詔住大相國寺慧林禪院將引對有司使習儀纍日神宗皇帝御便殿見之師既見但山呼即趍登殿賜坐即就榻槃足作加趺侍衛驚相顧師自如也賜茶至舉盞長吸又蕩撼之上問受業何寺對曰承天永安蓋蘇州承天寺永安院耳上大喜語論甚久既辭退目送之謂左右曰真福僧也侍者問和尚見官家如何對曰喫茶相問耳其天資粹美吐辭簡徑真超然可仰涿州尅符道者見臨濟機辨逸格以宗門有四料簡定佛祖旨要作偈發明之曰奪人不奪境緣自帶誵訛擬欲求玄旨思量反責麼驪珠光燦爛蟾桂影婆娑覿體無差㸦還應滯網羅奪境不奪人尋言何處真問禪禪是妄究理理非親日照寒光淡山遙翠色新直饒玄會得也是眼中塵人境兩俱奪從來正令行不論佛與祖那說聖凡情擬犯吹毛劒還如值木盲進前求妙會特地斬精靈人境俱不奪思量意不偏主賓言不異問答理俱全踏破澄潭月穿開碧落天不能明妙用淪溺在無緣洞山悟本禪師作五位君臣標準綱要又自作偈系於其下曰正中偏三更初夜月明前莫怪相逢不相識隱隱猶懷昔日嫌偏中正失曉老婆逢古鏡分明覿面更無他休更迷頭猶認影正中來無中有路出塵埃但能莫觸當今諱也勝前朝斷舌才偏中至兩刃交鋒不須避好手還同火裏蓮宛然自有衝天氣兼中到不落有無誰敢和人人盡欲出常流折合還歸炭裏坐臨濟洞上二宗相須發揮大法而是偈語世俗傳寫多更易之以徇其私失先德之意豫竊惜之今録古本於此正諸傳之誤報本元禪師孤硬風度甚高威儀端重危坐終日南禪師之門弟子能蹤迹其行藏者唯師而已師初開法法嗣書至南公視其名曰吾偶忘此僧謂專使曰書未欲開可令親來見老僧專使反命師即日包腰而來至豫章聞南公化去因留嘆息適晦堂老人出城相會與語奇之恨老師不及見耳師道化東吳人歸之者如雲嘗自乞食舟載而還夜有盜舟人絶呌白刃交錯於前師安坐自若徐曰所有盡以奉施人命不可害也盜既去達旦人來視舟意師死矣而㒵和神凝如他日其臨生死禍福能脫然無纍如此延慶洪準禪師桂林人從南禪師游有年天資純至未嘗忤物聞人之善如出諸己喜氣津津生眉宇間聞人之惡必合掌扣空若追悔者見者莫不笑之而其真誠如此終始一如暮年不領院事寓迹於寒溪寺壽已逾八十矣平生日夕無他營為眠食之餘唯吟梵音贊觀世音而已臨終時門人弟子皆赴檀越飯唯一僕夫在師携磬坐土地祠前誦孔經一遍告別即安坐瞑目三日不傾鄉民來觀者堵立師忽開目見笑使坐于地有頃門弟子還師呼立其右握手如炊熟久寂然視之去矣神色不變頰紅如生道俗塑其像龕之豫嘗過其廬拜瞻歎其平生多潛行密用不妄求知於世至於死生之際乃能超然如是真大丈夫也八地菩薩證無生法忍觀一切法如虗空性猶是漸證無心至十地中尚有二愚入等覺已則一分無明未盡猶如微煙尚能懺悔準之梵贊其亦自治者歟南禪師居積翠時一夕燕坐光屬屋廬誡侍者勿言于外嵩明教既化火浴之頂骨眼睛齒舌耳毫男根數珠皆不壞如世尊言比丘生身不壞發無垢智光者善根功德之力如來知見之力故行住坐臥須內外清淨彼二大老乃今耳目所接非異世也而獨爾殊勝者非平生踐履之明驗歟豫嘗作二偈曰如來功德力內外悉清淨念起勿隨之自然心無病形與佛祖等道致人天護戒淨福人天心空同佛祖豫嘗與數僧謁雲峰悅禪師塔拜起拊之曰生耶死耶久之自答曰不可推倒塔子去也旁僧曰今日時節正類道吾因緣因作偈示之曰不知即問不見即討圓滿現前何須更道維堅密身生死病老面前塔子不可推倒南安嵓儼和尚世傳定光佛之應身也異迹甚多亦自有傳然傳不載其得法師名字但曰西峰而已西峰在廬陵真廟時有雲豁禪師者奉先深公之高弟深見雲門當時龍象無有出其右者獨清涼明禪師與之齊名謂之深明二上座儼和尚多以偈示人偈尾必題四字曰贈以之中世莫能測臨終謂衆曰汝等當知妙性廓然本無生滅示有去來更疑何事吾此日生今正其時乃右脅而臥豫曰方其入滅乃曰吾此日生今正其時豫嘗游東吳寓於西湖淨慈寺寺之寢堂東西廡建兩閣甚崇麗寺有老衲為豫言永明和尚以賢首慈恩天台三宗㸦相冰炭不達大全心館其徒之精法義者於兩閣博閲義海更相質難和尚則以心宗之衡準平之又集大乘經論六十部西天此土賢望之言三百家證成唯心之旨為書一百卷傳於世名曰宗鏡録其為法施之利可謂博大殊勝矣今天下名山莫不有之而學者有終身未嘗展卷者唯飽食橫眠游談無根而已謂之報佛恩乎負佛恩乎同安察禪師作十玄談大宏正中妙挾之旨其言妙麗照映叢林然歲月寢遠多失其真今傳燈所載題目不同獨達觀所編五家宗派敘之頗詳豫嘗得舊本與五家宗派所載少差耳傳燈系師為九峰虔之嗣而達觀標師為雲居膺之子不省達觀何從得其實耶然清涼法眼去師之世不遠作贊詞其敘如傳燈所載則五家之論又可疑也十玄之詞其次敘當視其題目皆連聯而作前五首示其旨要後五首使履踐之然八首皆兩字為題意雖相貫而詞句疊為起伏初曰心印偈末曰無心猶隔一重關故又作祖意偈首曰真機爭墮有無功故又作真機偈首曰豈與塵機作繫留故又作塵異偈中曰三乘分別強安名故又作三乘次第耳此乃其所示之旨要也至其六則曰反本偈末曰還鄉曲調如何唱故又作還鄉偈其末曰更無一物獻尊堂是為正位坐却則非妙挾故又作回機機妙則失宗尚存知見是謂大病故又作轉位轉位則所謂異類中行異類全偏却須歸正使血脉不斷故又作一色過後此乃使之履踐之意也五家宗派亦云一色過後但塵異為塵中有異而已南禪師風度凝遠人莫涯其量故其門下客多光明偉傑名重叢林有終身未嘗見其破顏者豫聞厚於義者薄於仁師道也師尊而不親厚於仁者薄於義親道也親親而不尊南公之意豈不以是哉醉里有狂僧號戒道者依止聚落無日不醉然吐詞怪奇世莫能凡聖之有飲以酒者使自為祭文戒應聲曰惟靈生在閻浮不嗔不妬愛喫酒子倒街臥路直得生兜率陀天爾時方不喫酒故何以故淨土之中無酒得沽金剛般若經以無住為宗以無住為宗則宜其所談皆蕩相破有纖塵不立也而經贊福勝者半之持戒修福者有為事耳而世尊答能於此經生信心者必此人何也王文公罷相歸老鍾山見衲子必探其道學尤通首楞嚴嘗自疏其義其文簡而肆略諸師之詳而詳諸師之略非識妙者莫能窺也每曰今凡看此經者見其所示本覺妙明性覺明妙知根身器界生起不出我心竊自疑今鍾山山川一都會耳而游於其中無慮千人豈有千人內心共一外境耶借如千人之中一人忽死則此山川何嘗隨滅人去境留則經言山河大地生起之理不然何以會通稱佛本意耶
