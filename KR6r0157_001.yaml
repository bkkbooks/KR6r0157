body:
  text: 杭州興教小壽禪師初隨天台韶國師普請聞墮薪而悟作偈曰撲落非他物縱橫不是塵山河及大地全露法王身國師頷之而已及開法衲子爭師尊之御史中丞王公隨出鎮錢塘往候壽至湖上去騶從獨步登寢室壽方負暄毳衣自若忽見之問曰官人何姓王公曰隨姓王即拜之壽推蒲團藉地而坐語笑終日而去門人見壽讓之曰彼王臣來柰何不為禮此一眾所係非細事也壽唯唯佗日王公復至寺眾橫撞大鐘萬指出迎而壽前趍立于松下王公望見出輿握其手曰何不如前日相見而遽為此禮數耶壽顧左右且行且言曰中丞即得柰知事瞋何其天資粹美如此真本色住山人也白雲端禪師有逸氣少游湘中時會禪師新自楊岐來居雲盖一見心奇之與語每終夕會忽問曰上人落髮師為誰對曰茶陵郁和尚會曰吾聞其過溪有省作偈甚奇能記之否端即誦曰我有神珠一顆久被塵勞關鎻今朝塵盡光生照破山河萬朵會大笑而去端愕然左右視通夕不寐明日求入室咨詢其事時方歲旦會曰汝見昨日作夜狐者乎對曰見之會曰汝一籌不及渠端又大駭曰何謂也會曰渠愛人笑汝怕人笑端因大悟於言下魏府老元華嚴示眾曰佛法在日用處在行住坐臥處喫茶喫處語言相問處所作所為舉心動念又却不是也又曰時當缺減人壽少有登六七十者汝輩入我法中整頓手脚未穩早是三四十年須臾衰病至衰病至則老至老至則死至前去幾何尚復恣意何不初中後夜純靜去文潞公鎮北京元公來謁別潞公曰法師老矣復何往對曰入滅去潞公笑謂其戲語自送之歸與子弟言其道韻深穩談笑有味非常僧也使人候之果入滅矣大驚嘆異久之及闍維親往臨觀以瑠璃缾置坐前祝曰佛法果靈願舍利填吾瓶言卒煙自空而降布入瓶中烟滅舍利如所願潞公自是竭誠內典恨知之暮也棲賢諟禪師建陽人嗣百丈常和尚性高簡律身精嚴動不遺法度暮年三終藏經以坐閱為未敬則立誦行披之黃龍南禪師初游方少從之累年故其平生所為多取法焉甞曰棲賢和尚定從天人中來叢林標表也雪竇顯禪師甞自淮山來依之不合乃作師子峰詩而去曰踞地盤空勢未休爪牙安肯混常流天教生在千峰上不得雲擎也出頭李肇國史補曰崔趙公問徑山道人法欽弟子出家得否欽曰出家是大丈夫事非將相所為趙公嘆賞其言贊寧作欽傳無慮千言雖一報曉雞死且書之乃不及此何也大覺禪師璉公以道德為仁廟所敬天下想望風采其居處服玩可以化寶坊也而皆不為獨於都城之西為精舍容百許人而已棲賢舜老夫為郡吏臨以事民其衣走依璉璉館於正寢而自處偏室執弟子禮甚恭王公貴人來候者皆恠之璉具以實對且曰吾少甞問道於舜今不當以像服之殊而二吾心也聞者嘆服仁廟知之賜舜再落髮仍居栖賢唐宣宗微時武宗疾其賢數欲殺之宦者仇公武保佑之事迫公武為薙髮作比丘使逸游故天下名山多所登賞至杭州鹽官禪師安公者江西馬祖之高弟一見異之待遇特厚故宣宗留鹽官㝡久及即位思見之而安公化去久矣先是武宗盡毀吾教至是復興之雖法之隆替系於時然庸詎知其力非安公致之耶仇公武之德不愧漢邴吉而新書略之獨班班見於安禪師傳為可嘆也甞有贊其像者曰已將世界等微塵空裏浮華夢裏身勿謂龍顏便分別故應天眼識天人贊寧作大宋高僧傳用十科為品流以義學冠之已可笑又列嵓頭豁禪師為苦行智覺壽禪師為興福雲門大師僧中王也與之同時竟不載何也長沙岑禪師因僧亡以手摩之曰大眾此僧却真實為諸人提綱商量會麼乃有偈曰目前無一法當處亦無人蕩蕩金剛體非妄亦非真又曰不識金剛體却喚作緣生十方真寂滅誰在復誰行雪峰和尚亦因見亡僧作偈曰低頭不見地仰面不見天欲識金剛體但看髑髏前玄沙曰亡僧面前正是觸目菩提萬里神光頂後相有僧問法眼如何是亡僧面前觸目菩提答曰是汝面前又問遷化向什麼處去答曰亡僧幾曾遷化進曰爭奈即今何答曰汝不識亡僧近代尊宿不復以此旨曉人獨晦堂老師時一提起作南禪師圓寂日偈曰去年三月十有七一夜春風撼籌室三角麒麟入海中空餘片月波心出真不掩偽曲不藏直誰人為和雪中吟萬古知音是今日又曰昔人去時是今日今日依前人不來今既不來昔不往白雲流水空悠哉誰云秤尺平直中還有曲誰云物理齊種麻還得粟可憐馳逐天下人六六元來三十六南禪師居積翠時以佛手驢脚生緣語問學者答者甚眾南公瞑目如入定未甞可否之學者趨出竟莫知其是非故天下謂之三關語晚年自作偈三首今只記其二曰我手佛手齊舉禪流直下薦取不動干戈道處自然超佛越祖我脚驢脚並行步步皆契無生直待雲開日現此道方得縱橫雲蓋智禪師甞為予言曰昔日再入黃檗至坊塘見一僧自山中來因問三關語兄弟近日如何商量僧曰有語甚妙可以見意我手何似佛手曰月下弄琵琶或曰遠道擎空鉢我脚何似驢脚曰鷺鷥立雪非同色或曰空山踏落花如何是汝生緣處曰某甲某處人時戲之曰前塗有人問上座如何是佛手驢脚生緣意旨汝將遠道擎空鉢對之耶鷺鶿立雪非同色對之耶若俱將對則佛法混濫若揀擇對則機事偏枯其僧直視無所言吾謂曰雪峰道底夾山會禪師初住京口竹林寺升座僧問如何是法身答曰法身無相如何是法眼答曰法眼無瑕時道吾笑於眾中會遙見因下座問曰上座適笑笑何事耶道吾曰笑和尚一等行脚放複子不著所在會曰能為我說否對曰我不會說秀州華亭有船子和尚可往見之會因散眾而往船子問曰大德近住何寺對曰寺則不住住則不寺船子曰不寺似箇什麼對曰不是目前法船子曰何處學得來對曰非耳目所到船子笑曰一句合頭語萬劫繫驢橛嗟乎於今叢林師受弟子例皆禁絕悟解推去玄妙唯要直問直答無則始終言無有則始終言有毫末差誤謂之狂解使船子聞之豈止萬劫繫驢橛而已哉由此觀之非特不善悟要亦不善疑也善疑者必思三十三祖授法之際悟道之緣其語言具在皆可以理究以智知獨江西石頭而下諸大宗師以機用應物觀其問答溟涬然令人坐睡其道異諸祖耶則嗣其法其不異耶則所言乃爾不同故知臨濟大師曰大凡舉論宗乘須一句中具三玄一玄中具三要有玄有要者盖明此也不知者指為門庭建立權時語言可悲也天衣懷禪師說法於淮山三易法席學者追崇道顯著矣然猶未敢通名字於雪竇雪竇已奇之僧有誦其語至曰譬如鴈過長空影沈寒水鴈無遺蹤之意水無沈影之心因搏髀嘆息即遣人慰之懷乃敢一通狀問起居而已溈山真如禪師從真點胸游最久叢林戶知之然對客未甞一言及其平昔見聞之事至圓寂日展𦘕像但薦茶果而已二大老識度甚遠退託凉薄以諷後學可謂善推尊其師者也雲菴和尚居洞山時僧問華嚴論云以無明住地煩惱便為一切諸佛不動智一切眾生皆自有之只為智體無性無依不能自了會緣方了且無明住地煩惱如何是成諸佛不動智理極深玄絕難曉達雲菴曰此最分明易可了解時有童子方掃除呼之回首雲菴指曰不是不動智却問如何是汝佛性童子左右視惘然而去雲庵曰不是住地煩惱若能了之即今成佛又甞問講師曰火災起時山河大地皆被焚盡世間空虗是否對曰教有明文安有不是之理雲庵曰如許多灰燼將置何處講師舌大而乾笑曰不知雲庵亦大笑曰汝所講者紙上語耳其樂說無礙之辨答則出人意表問則學者喪氣盖無師自然之智非世智可當真一代法施主也二祖大師服勤累年至於立雪斷臂而達磨僅以一言語之牛頭懶融枯禪窮山初無意於有聞而四祖自往說法祖師之於師弟子之際其必有旨耶楊文公談苑記沙門寶誌銅牌記讖未來事云有一真人在冀川開口張弓在左邊子子孫孫萬萬年江南中主名其子曰弘冀吳越錢鏐諸子皆連弘字期以應之而宣祖之諱正當之也又記周世宗悉毀銅像鑄錢謂宰相曰佛教以謂頭目髓腦有利於眾生尚無所惜寧復以銅像愛乎銅州大悲甚靈應當擊毀以斧擊其胸鑱破之太祖親見其事後世宗北征病疽發胸間咸謂其報應太祖因信重釋教歐陽文忠公歸田錄首記太祖初幸相國寺問僧錄贊寧可拜佛否寧奏曰不拜問其故寧曰見在佛不拜過去佛因以為定制二公所記皆有深意決非苟然予聞君子樂與人為善雖善不善謂之矜文忠公每恨平心為難豈真然耶唐僧元曉者海東人初航海而至將訪道名山獨行荒陂夜宿塚間渴甚引手掬水于穴中得泉甘凉黎明視之髑髏也大惡之盡欲嘔去忽猛省嘆曰心生則種種法生心滅則髑髏不二如來大師曰三界唯心豈欺我哉遂不復求師即日還海東疏華嚴經大弘圓頓之教予讀其傳至此追念晉樂廣酒盃蛇影之事作偈曰夜塚髑髏元是水客盃弓影竟非蛇箇中無地容生滅笑把遺編篆縷斜棗栢大士清凉國師皆弘大經造疏論宗於天下然二公制行皆不同棗栢則跣行不滯超放自如以事事無礙行心清凉則精嚴玉立畏五色糞以十願律身評者多喜棗栢坦宕笑清凉縛束意非華嚴宗所宜爾也予曰是大不然使棗栢薙髮作比丘未必不為清凉之行盖此經以遇緣即宗合法非如餘經有局量也晉鳩摩羅什兒時隨母至沙勒頂戴佛鉢私念鉢形甚大何其輕耶即重失聲下之母問其故對曰我心有分別故鉢有輕重耳予以是知一切諸法隨念而至念未生時量同太虗然則即今見行分別者萬類紛然何故靈驗不等曰是皆亂想虗妄如困夢中事心力昧略微劣故也嗟乎人莫不有忠孝之心也而王祥臥冰則魚躍耿恭祝井則泉冽何也盖其養之之專故靈驗之應速如影響菩提達磨初自梁之魏經行於嵩山之下倚杖於少林面壁燕坐而已非習禪也久之人莫測其故因以達磨為習禪夫禪那諸行之一耳何足以盡聖人而當時之人以之為史者又從而傳茲習禪之列使與枯木死灰之徒為伍雖然聖人非止於禪那而亦不違禪那如易出乎陰陽而亦不違乎陰陽舊說四祖大師居破頭山山中有無名老僧唯植松人呼為栽松道者甞請於祖曰法道可得聞乎祖曰汝已老脫有聞其能廣化耶儻能再來吾尚可遲汝乃去行水邊見女子浣衣揖曰寄宿得否女曰我有父兄可往求之曰諾我即敢行女首肯之老僧回䇿而去女周氏季子也歸輙孕父母大惡逐之女無所歸日庸紡里中夕於眾館之下已而生一子以為不祥弃水中明日見之泝流而上氣體鮮明大驚遂舉之成童隨母乞食邑人呼為無姓兒四祖見於黃梅道中戲問之曰汝何姓曰姓固有但非常姓祖曰何姓曰是佛性祖曰汝乃無姓耶曰姓空故無祖化其母使出家時七歲眾館今為寺號佛母而周氏尤盛去破頭山佇望間道者肉身尚在黃梅東禪有佛母塚民塔其上傳燈錄定祖圖記忍大師姓周氏者從母姓也大宋高僧傳乃曰釋弘忍姓周氏其母始娠移月光照庭室終夕若晝異香襲人舉家欣駭安知眾館本社屋生時置水中乎又曰其父偏愛因令誦書不知何從得此語其敘事妄誕大率類此開元中文學閭丘均為塔徒文而已會昌毀廢唐末烽火更遭蹂踐愈不可考知其書謬者母氏周而曰有父故也無為子甞贊其像曰人孰無父祖獨有母其母為誰周氏季女濁港滔滔入大江門前依舊長安路斷際禪師初行乞於雒京吟添鉢聲一嫗出棘扉間曰太無猒足生斷際曰汝猶未施反責無猒何耶嫗笑掩扉斷際異之與語多所發藥辭去嫗曰可往南昌見馬大師斷際至江西而大師已化去聞塔在石門遂往禮塔時大智禪師方結廬塔傍因敘其遠來之意願聞平昔得力言句大智舉一喝三日耳聾之語示之斷際吐舌大驚相從甚久暮年始移居新吳百丈山考其時嫗死久矣而大宋高僧傳曰嫗祝斷際見百丈非也雲居佛印禪師曰雲門和尚說法如雲絕不喜人記錄其語見必罵逐曰汝口不用反記我語佗時定販賣我去今對機室中錄皆香林明教以紙為衣隨所聞隨即書之後世學者漁獵文字語言中正如吹網欲滿非愚即狂可嘆也玄沙備禪師薪於山中傍僧呼曰和尚看虎玄沙見虎顧僧曰是你靈潤法師山行野燒迅飛而來同游者皆避之潤安步如常曰心外無火火實自心謂火可逃無由免火火至而滅嚴陽尊者單丁住山蛇虎就手而食歸宗常公刈草見蛇芟之傍僧曰久聞歸宗今日乃見一麤行沙門常曰你麤我麤耶吾聞親近般若有四種驗心謂就事就理入就事理出就事理之外宗門又有四藏鋒之用親近以自治藏鋒之用以治物荊州天皇寺道悟禪師如傳燈錄所載則曰道悟得法於石頭所居寺曰天皇婺州東陽人姓張氏年十四出家依明州大德披剃年二十五杭州竹林寺受具首謁徑山國一禪師服勤五年大歷中抵鍾陵謁馬大師經二夏乃造石頭元和丁亥四月示疾壽六十臘三十五及觀達觀禪師所集五家宗派則曰道悟嗣馬祖引唐丘玄素所譔文幾千言其略曰師號道悟渚宮人姓崔氏即子玉後胤也年十五於長沙寺禮曇翥律師出家二十三詣嵩山律德得尸羅謁石頭扣寂二年無所契悟乃入長安親忠國師三十四與侍者應真南還謁馬大師大悟於言下祝曰他日莫離舊處故復還渚宮元和十三年戊戌歲四月初示疾十三日歸寂壽八十二臘六十三考其傳正如兩人然玄素所載曰有傳法一人崇信住澧州龍潭南嶽讓禪師唐聞人歸登撰列法孫數人于後有道悟名圭峰答裴相國宗趣狀列馬祖之嗣六人首曰江陵道悟其下注曰兼稟徑山今妄以雲門臨濟二宗競者可發一笑草堂禪師牋要曰心體靈知不昧如一摩尼珠圓照空淨都無差別之相以體明故對物時能現一切色相色自差而珠無變易如珠現黑時人以珠為黑者非見珠也離黑覔珠者亦非見珠也以明黑都無為珠者亦非見珠也馬祖說法即妄明真正如以黑為珠神秀說法令妄盡方見覺性者離妄求真正如離黑覔珠牛頭說法一切如夢本來無事真妄俱無正如明黑都無為珠獨荷澤於空相處指示知見了了常知正如正見珠體不顧眾色也密以馬祖之道如珠之黑是大不然即妄明真方便語耳略知教乘者皆了之豈馬祖應聖師遠讖為震旦法主出其門下者如南泉百丈大達歸宗之徒皆博綠三藏熟爛真妄之論爭服膺師尊之而其道乃止於如珠之黑而已哉又以牛頭之道一切如夢真妄俱無者是大不然觀其作心王銘曰前際如空知處迷宗分明照境隨照冥濛縱橫無照最微最妙知法無知無知知要一一皆治知見之病而荷澤公然立知見優劣可見而謂其道如明黑都無為珠者豈不重欺吾人哉至如北秀之道頓漸之理三尺童子知之所論當論其用心秀公為黃梅上首頓宗直指縱曰機器不逮然亦飫聞飽參矣豈自甘為漸宗徒耶盖祖道于時疑信半天下不有漸何以顯頓哉至於紛爭者皆兩宗之徒非秀心也便謂其道止如是恐非通論吾聞大聖應世成就法道其權非一有顯權有冥權冥權即為異道為非道顯權則為親友為知識庸詎知秀公非冥權也哉唐僧復禮有法辯當時流輩推尊之作真妄偈問天下學者曰真法性本淨妄念何由起從真有妄生此妄何所止無初即無末有終應有始無始而無終長懷懵茲理願為開玄妙析之出生死清凉國師答曰迷真妄念生悟真妄即止能迷非所迷安得長相似從來未曾悟故說妄無始知妄本自真方是恒妙理分別心未忘何由出生死圭峰禪師答曰本淨本不覺由斯妄念起知真妄即空知空妄即止止處名有終迷時號無始因緣如幻夢何終復何始此是眾生源窮之出生死又曰人多謂真能生妄故妄不窮盡為決此理重答前偈曰不是真生妄妄迷真而起悟妄本自真知真妄即止妄止似終末悟來似初始迷悟性皆空皆空無終始生死由此迷達此出生死予味二老所答之辭皆未副復禮問意彼問真法本淨妄念何由而起但曰迷真不覺則孰不能答耶因為明其意作偈曰真法本無性隨緣染淨起不了號無明了之即佛智無明全妄情知覺全真理當念絕古今底處尋終始本自離言詮分別即生死雲菴和尚甞曰諸佛隨宜說法意趣難解如起信曰若有眾生來求法者隨己能解方便為說不應貪著名利恭敬唯念自利利他回向菩提故者為弘法太峻者言之也圓覺曰末世眾生欲修行者應當盡命供養善友事善知識彼善知識欲來親近應斷瞋恨現逆順境猶如虗空者為求道不精進者言之也雖然為弟子者能不忘精進則為師者不害於太峻方今學者未能盡致敬之禮而責以慳法則過矣侍者進曰然則三世如來法施之式可得聞乎曰法華曰於一切眾生平等說法以順法故不多不少乃至深愛法者亦不為多說此佛之遺意也達觀穎禪師初出東吳年纔十六七泊舟秦淮宿奉先寺時寺皆講人見其禪者又少之不為禮穎讓曰佛記比丘惡客比丘至者法將滅爾輩安為之耶有畣者曰上人即主此敬客未晚㯋笑曰我顧未暇居此然能易道行者使飯十方僧報佛恩耳時內翰葉公清臣守金陵穎袖書謁之葉公曰昨晚至此何以知建寺始末之詳如此乎對曰夜閱舊知之因極言律居之弊敗傷風化葉公大奇之奉先緣是乃為禪林吳中講師多譏諸祖傳法偈無譯人禪者與之辨失其真適足以重其謗穎諭之曰此達磨為二祖言者也何須譯人耶如梁武初見之即問如何是聖諦第一義答曰廓然無聖進曰對朕者誰又曰不識使達磨不通方言則何於是時便能爾耶講師不敢復有辭其挫服魔外之氣無師自然之智發自妙齡而遇事則應無所疑畏天性則然後為石門聦之嗣首山嫡孫也涅槃經迦葉菩薩白佛言世尊如佛所說諸佛世尊有秘密藏是義不然何以故諸佛世尊唯有密語無密藏譬如幻主機關木人人雖覩見屈伸俯仰莫知其內而使之然佛法不爾咸令眾生悉得知見云何當言佛世尊有秘密藏佛讚迦葉善哉善哉善男子如汝所言如來實無秘密之藏何以故如秋滿月處空顯露清淨無翳人皆觀見如來之言亦復如是開發顯露清淨無翳愚人不解謂之秘藏智者了達則不名藏又曰又無語者猶如嬰兒言語未了雖復有語實亦無語如來亦爾語未了者即秘密之言雖有所說眾生不解故名無語故石頭曰乘言須會宗勿自立規矩藥山曰更須自看不得絕却言語我今為汝說者箇語顯無語底長慶曰二十八代祖師皆說傳心且不說傳語且道心作麼生傳若也無言啟蒙何名達者雲門曰此事若在言語上三乘十二分教豈是無說因什麼道教外別傳若從學解機智得只如十地聖人說法如雲如雨猶被佛呵見性如隔羅縠以此故知一切有心天地懸殊雖然如是若是得底人道火何曾燒著口耶予每曰衲子於此徹去方知諸佛無法可說而證言說法身如何是言說法身自答曰斷頭船子下楊州王文公曰佛與比丘辰巳間應供名為齋者與眾生接不可不齋又以佛性故等視眾生而以交神之道見之故首楞嚴曰嚴整威儀肅恭齋法又曰梵語三昧此云正定正定中所受境界謂之正受異於無明所緣受故圓覺曰三昧正受釋者謂梵語三昧此云正受而寶積云三昧及正受則此釋非也曹溪大師將入涅槃門人行瑫超俗法海等問和尚法何所付曹溪曰付囑者二十年外於此地弘揚又問誰人答曰若欲知者大庾嶺上以網取之圭峰欲立荷澤為正傳的付乃文釋之曰嶺者高也荷澤姓高故密示之耳欲抑讓公為旁出則曰讓則曹溪門下旁出之汎徒此類數可千餘嗚呼逐鹿者不見山攫金者不見人殆非虗言方密公所見唯荷澤故諸師不問是非例皆毀之如大庾嶺上以網取之之語是大師末後全提妙旨而輙以意求讓公僧中之王而謂之汎徒詳味密公之意可以發千載之一笑老安國師有言曰金剛經曰應無所住而生其心無所住者不住色不住聲不住迷不住悟不住體不住用而生其心者即一切法而顯一心若住善生心即善現若住惡生心即惡現本心即隱沒若無所住十方世界唯是一心信知曹溪大師云風幡不動是心動脩山主有偈曰風動心搖樹雲生性起塵若明今日事暗却本來人有僧問晦堂老人曰五祖前身栽松道者甞託周氏女而生彼三緣不和合何從而生耶老人笑曰汝聞樹提伽生於火中伊尹生於空桑乎對曰聞之汝於彼二人乃不疑其生不由三緣而獨疑五祖耶方今士大夫之留意宗乘者皆以此為疑及聞此語莫不釋然予以謂老人所示未欲極教乘之本意第就其機息狂情耳馬大師曰佛是能仁有智慧善機宜能破一切眾生疑網出離有無等縛其斯之謂歟宗鏡錄曰雖然心即是業業即是心既從心生還從心受如何現今消其妄業報答曰但了無作自然業空所以云若了無作惡業一生成佛又曰雖有作業而無作者即是如來秘密之教又凡作業悉是自心橫計外法還自對治妄取成業若了心不取境境自不生無法牽情云何成業予甞作偈釋其旨曰舉手炷香而供養佛其心自知應念獲福舉手操刀恣行殺戮其心自知死入地獄或殺或供一手之功云何業報罪福不同皆自橫計有如是事是故從來枉沈生死雷長芭蕉銕轉磁石俱無作者而有是力心不取境境亦自寂故如來藏不許有識維摩經曰入不思議境如借座燈王取飯香土促演其日劫大小之相容可以神會妙旨至曰一切聲聞聞是不可思議解脫法門皆應號泣聲震三千大千世界極難解通首楞嚴曰一人發真歸源十方虗空悉皆消殞見道者妄盡覺明自見空殞可也而下文乃又曰一切魔王見其宮殿無故坼裂為難和會古諸法師俱有注釋校其所論未容無說臨濟大師建立四賓主今徒閱其語竟莫能分辨之知之者未必真不知者以為苟然又有四喝一喝如金剛王寶劍一喝如踞地師子一喝如探竿影草有時一喝不作一偈用如踞地師子探竿影草後學往往不省其何等語安能識其意耶不過曰此古人一期建立之辭耳何足問哉然則臨濟之言遂為虗語也今係其偈於此曰金剛王劒覿露堂堂才涉唇吻即犯鋒鋩踞地師子本無窠臼顧佇之間即成滲漏探竿影草莫入陰界一點不來賊身自敗有時一喝不作喝用佛法大有只是牙痛予游長沙至鹿苑見岑禪師𦘕像想見其為人作岑大蟲贊并序曰如來世尊語阿難曰汝元不知一切浮塵諸幻化相當處出生隨處滅盡幻妄稱相其性真為妙覺明體龍勝菩薩曰諸法不自生亦不從他生不共不無因是故說無生以佛祖之辯談心法之妙其清淨顯露如掌中見物無可疑者而末世眾生卒不明了者蓋其迷妄之極非其所聞之習故也禪師憫之故於所習之境譬之曰若心是生則夢幻空華亦應是生若身是生則山河大地森羅萬象亦應是生大哉言乎與首楞嚴中觀論相終始也禪師大寂之孫南泉之子趙州之兄開法於長沙之鹿苑當時衲子倔強如仰山者猶下之而呼以為岑大蟲云為之贊曰長沙大蟲聲威甚重獨眠空林百獸震恐寂子兒癡見不知畏引手捋鬚幾缺其耳大空小空是虎是你如備與覺可撩其尾嗟今衲子眼如裴旻但見其彪安識虎真我拜公像非存非沒百尺竿頭行塵勃勃白雲端禪師曰天下叢林之興大智禪師力也祖堂當設達磨初祖之像於其中大智禪師像西向開山尊宿像東向得其宜也不當止設開山尊宿而略其祖宗耳雲居祐禪師曰吾觀諸方長老示滅必塔其骸山川有限而人死無窮百千年之下塔將無所容於是於宏覺塔之東作卵塔曰凡住持者自非生身不壞火浴雨舍利者皆以骨石填於此其西又作卵塔曰凡眾僧化皆藏骨石於此謂之三塔二大老識度高遠可為後世法然孤論難持犯眾難成卒必有賞音者吾將觀焉東京覺嚴寺有誠法師講華嚴經歷席最久學者依以揚聲其為人純至少緣飾高行遠識近世講人莫有居其右者元祐初高麗僧統航海至上表乞傳持賢首宗教歸本國流通奉聖旨下兩街舉可以授法者有司以師為宜上表辭免曰臣雖刻意講學識趣淺陋特以年運已往妄為學者所推今異國名僧航海問道宜得高識博聞者為之師竊見杭州慧因院僧道源精練教乘旁通外學舉以自代實允公議奉聖旨依所乞勑差朝奉郎揚傑館伴至錢塘受法予建中靖國之初故人處獲洞山初禪師語一編福嚴良雅所集其語言宏妙真法窟爪牙大略曰語中有語名為死句語中無語名為活句未達其源者落在第八魔界中又曰言無展事語不投機乘言者喪滯句者迷於此四句語中見得分明也作箇脫洒衲僧根椽片瓦粥飯因緣堪與人天為善知識於此不明終成莽鹵雲菴平生說法多稱初悟門度越格量偶閱舊記見其寄道友偈并序曰昔洞山參雲門悟旨於言下入佛正知見所有炙脂帽子鶻臭布衫皆脫去以四句偈明其悟盖得展事自在之用投機善巧之風故其應機接物不乘言不滯句如師子王得大自在於哮吼時百獸震駭盖法王法如是故也又世所傳見雲門者皆坐脫立亡何哉以無佛法知見故也因隨句釋以奉寄曰大用現前能展事春來何處不開花放伊三頓參堂去四海當知共一家又曰千差萬別解投機明眼宗師自在時北斗藏身雖有語出群消息少人知又曰游山翫水便乘言自己商量總不偏鶻臭布衫脫未得且隨風俗度流年又曰滯句乘言是瞽聾參禪學道自無功悟來不費纖毫力火裏蝍蟟吞大蟲宗道者不知何許人往來舒蘄間多留於投子性嗜酒無日不酔村民愛敬之每餉以醇醪居一日方入浴聞有尋宗者度其必送榼至裸而出得酒徑去人皆大笑而宗傲然不怍甞散衣下山有逆而問者曰如何是道者家風對曰袈裟褁草鞋問意旨如何曰赤脚下桐城陳退夫初赴省幃過宗戲問曰瓘此行欲作狀元得否宗熟視曰無時即得莫測其言也而退夫果以第三名上第時彥作魁方悟無時之語宗見雪竇而超放自如言法華之流也雪竇初在大陽玄禪師會中典客與僧夜語雌黃古今至趙州栢樹子因緣爭辨不已有行者立其旁失笑而去客退雪竇呼至數之曰對賓客敢爾耶對曰知客有定古今之辯無定古今之眼故敢笑曰且趙州意汝作麼生會因以偈對曰一兔橫身當古路蒼鷹纔見便生擒後來獵犬無靈性空向枯樁舊處尋雪竇大驚乃與結友或云即承天宗禪師也予謂聞此可以想見當時法席之盛也晦堂老人甞以小疾醫寓漳江轉運判官夏倚公立往見之因劇談妙道至會萬物為自己及情與無情共一體時有犬臥香案下以壓尺擊又擊香案曰犬有情即去香案無情自住情與無情如何得成一體去夏不能答晦堂曰纔入思惟便成剩法何曾會物為己耶老黃龍入滅道俗請繼主道場法席之盛初不減平時然性真率不樂從事五求解去乃得謝事閑居而學者益親謝景溫師直守潭州虗大溈以致之三辭弗往又囑江西彭汝礪器資請所以不應長沙之意晦堂曰願見謝公不願領大溈也馬祖百丈已前無住持事道人相求於空閑寂寞之濵而已其後雖有住持王臣尊禮為人天師今則不然掛名官府如有戶籍之民直遣伍伯追呼耳豈可復為也器資以斯言反命師直由是致書願得一見不敢以住持相屈遂往長沙盖於四方公卿意合則千里應之不合則數舍亦不往也開法黃龍十二年退居菴頭二十餘年天下指晦堂為道之所在盖末世宗師之典刑也圓通祖印訥禪師告老於郡乞請承天端禪師主法席郡可其請端欣然而來自以少荷大法前輩讓善叢林責己甚重故敬嚴臨眾以公滅私於是宗風大振未幾年訥公厭閴寂郡守至自陳客情太守惻然目端端笑唯唯而已明日登座曰昔日大法眼禪師有偈曰難難難是遣情難情盡圓明一顆寒方便遣情猶不是更除方便太無端大眾且道情作麼生遣喝一喝下座包腰而去一眾大驚遮留之不可叢林至今敬畏之南禪師住廬山歸宗火一夕而燼大眾譁譟動山谷而黃龍安坐如平時桂林僧洪準欲掖之而走顧見叱之準曰和尚縱厭世間慈明法道何所賴耶因徐整衣起而火已及座榻矣坐是入獄郡吏發其私忿考掠百至絕口不言唯不食而已兩月而後得釋鬚髮不剪皮骨僅存真點胸迎於中塗見之不自知泣下曰師兄何至是也黃龍叱曰者俗漢真不覺拜之蓋其不動如山類如此曹山躭章禪師初辭洞山悟本本曰吾在雲巖先師處親印寶鏡三昧事窮的要今付受汝汝善護持無令斷絕遇真法器方可傳委直須秘密不得影露恐屬流布喪滅吾宗夫末法時代人多乾慧若要辨認向去之人真偽有三種滲漏當機直須具眼一見滲漏者機不離位墮在毒海二情滲漏者智常向背見處偏枯三語滲漏者體妙失宗機昧終始濁智流轉於此三種子宜知之又綱要三偈初敲倡俱行曰金針雙鎻備狹路隱全該寶印當空妙重重錦縫開其次金鎻玄路曰交牙明中暗功齊轉覺難力窮尋進退金鎻網鞔鞔又其次理事俱不涉曰理事俱不涉回照絕幽微背風無巧拙電火爍難追衲子當機能如電火難追則方透三種滲漏圓覺曰眾生為解礙菩薩未離覺故知脫生死於言下自非上根大智何以臻此大愚以黃檗為老婆良有以也黃檗每曰決定不流至第二念就中方入我宗門盖宗乘有旨趣下流不悟妄生同異欲望大法之興不亦難乎龍牙和尚作半身寫照其子報慈匡化為之贊曰日出連山月圓當戶不是無身不欲全露二老洞山悟本兒孫也故其家風機貴回互使不犯正位語忌十成使不墮今時而匡化匠心獨妙語不失宗為可貴也餘杭政禪師甞自寫照又自為之贊曰貌古形踈倚杖黎分明𦘕出須菩提解空不許離聲色似聽孤猿月下啼政公超然奇逸人也故其高韻如光風霽月詞致清婉而道味苦嚴古今贊偈甚多予尤愛此二篇圭峰日用偈曰作有義事是惺悟心作無義事是散亂心散亂隨情轉臨終被業牽惺悟不由情臨終能轉業偶閱唐史李訓之敗被綠衣詭言黜官走終南依密密欲匿之其徒不可乃奔鳳翔為盩庢吏所執訓死仇士良捕密詰之怡然曰與訓游久吾法遇難則救初無愛憎死固吾分予謂比丘於唐交士大夫者或見於傳記多犯法辱教而圭峰獨超然如此為史者亦欣然點筆疾書盖其履踐之明也觀其偈則無不欲透脫情境譬如香象擺壞鐵鏁自在而去豈若蠅為唾所涴哉雲菴住歸宗時方送法眼大師茶毗時雨新霽泥方滑道忽躂倒大眾爭掖而起舉火把曰法眼茶毗歸宗遭攧呈似大眾更無可說石頭大師作參同契其末曰謹白參玄人光陰莫虗度法眼禪師注曰住住恩大難酬法眼可謂見先德之心矣眾生日用以妄想顛倒自蔽光明故多遺時失候謂之虗度光陰有道者無他能善用其心耳故趙州曰一切但仍舊從上諸聖無不從仍舊中得大智度論曰眾生心性猶如利刀唯用割泥泥無所成刀日就損理體常妙眾生自麤能善用之即合本妙首楞嚴曰佛謂阿難譬如琴瑟箜篌琵琶雖有妙音若無妙指終不能發汝與眾生亦復如是寶覺真心各各圓滿如我按指海印發光汝暫舉心塵勞先起華嚴偈曰若人欲識佛境界當淨其意如虗空遠離妄想及諸見令心所向皆無礙大智禪師曰夫教語皆是三句相連初中後善初直須教渠發善心中破善後始明善菩薩即非菩薩是名菩薩法非法非非法總與麼也若即說一句答令人入地獄若三句一時說渠自入地獄不干教主事故知古大宗師說法皆依佛祖法式不知者以謂苟然語如無著所釋金剛般若是此意也洞山安立五位道眼明者視其題目十五字排布則見悟本老人如曰正中偏偏中正正中來偏中至兼中到是也汾陽頌曰五位參尋切要知纖毫纔動即差違金剛透匣誰能解唯有那叱第一機舉目便令三界淨振鈴還使九天歸正中妙挾通回互擬議鋒鋩失却威金剛般若曰如我說法如筏喻者法尚應捨何況非法西天此土聖賢釋者無慮千餘人然莫如無著得佛之意雙林大士又從而申明之無著於此判為言說法身意以謂筏者言說也雖與人俱然亦不類如筏行水中而實不住非法者二邊也在筏且不類豈於二邊而止住耶故曰何況非法大士偈曰渡河須用筏到岸不須舡人法俱名執悟理誰勞詮中流仍被溺誰論在二邊有無如取一即被污心田故曹洞宗旨有混不得類不齊之語也雲峰悅禪師再游泐潭重會南禪師敘別講舊相得甚懽久之更使一見石霜慈明老人既至石霜憩於山前莊聞其坦率之風悔來因不復過門徑造南岳福嚴未期月掌記室俄長老賢公化去郡以慈明來居之初聞夜參貶剝諸方異解皆其平生艱難而得者於是歎服即投誠問道三往三被罵而退不勝忿業已歸之明日復往慈明罵如故因啟曰某唯以不解故來問善知識宜施方便不蒙開示專以罵為豈從上所以授法之式耶慈明驚曰南書記我謂汝是箇人乃作罵會耶黃龍聞其語如桶底脫拜起汗下從容論趙州因緣呈偈曰傑出叢林是趙州老婆勘破沒來由如今四海清如鏡行人莫與路為讎慈明閱之笑曰偈甚佳但易一字曰老婆勘破有來由其機智妙密又如此黃龍辭去白曰大事畢竟如何慈明訶曰著衣喫飯不是畢竟痾屎送尿不是畢竟予甞游福嚴覽其山川之形勝讀思大所記曰此山增人之志力居之者多得道故祖宗授法莫不因之雖大法之興必依之人然馬祖於此受讓公記莂其道大振於江西今慈明黃龍事迹復相類亦足怪也生法師曰敲空作響擊木無聲法眼禪師忽聞齋魚聲謂侍者曰還聞麼適來若聞如今不聞如今若聞適來不聞會麼有僧甞登三生藏取思大平生所持錫立之疑慮橫生終不能定忽自念曰當一切放下却即舉錫置之錫卓然不傾以問予其故何哉予曰非特於錫則然凡事若有心即成差悞試觀兒輩剪紙擬心即失不擬心徑往無難故道人不可須臾忘照也首楞嚴曰汝元不知一切浮塵諸幻化相當處出生隨處滅盡涅槃曰譬如猛火不能燒薪火出木盡名為燒薪般若燈論曰根境理同然智者何驚異衲子於此見徹方入阿字法門康僧會天竺人吳赤烏十年初至建業營立茆茨設像行道孫權疑為矯異召問曰有何靈驗對曰如來遷迹忽逾千載遺骨舍利神耀無方昔阿育王起塔至八萬四千塔寺之興表遺化也權曰若得舍利當為造塔如其虗妄國有常刑會請期七日乃謂其屬共結淨室以銅瓶加瓦燒香禮請至期無應會求伸至三七忽聞瓶中鎗然有聲果獲舍利以示權權與群臣聚觀五色屬人權大驚而起曰希有之瑞也釋曇諦父肜嘗為冀州別駕母黃氏晝𥨊夢一僧呼為母寄一麈尾并鐵鏤書鎮二枚既覺而兩物俱存因而懷娠生諦此二物乃諦前身為宏覺法師為姚萇講法華所獻追繹宏覺捨命正是寄物之日會以真誠之至能生致舍利諦以大願所持亦能死將長物嗚呼真誠大願之力尚能反易生死如意自在況守護心城者耶莊子言藏舟於壑藏山於澤釋者遣語如流至曰藏天下於天下未有不嗒然危坐置筆而思者晦堂老人甞問學者此義如何對之甚眾晦堂笑曰汝善說道理予作偈記其意曰天下心知不可藏紛紛嗅迹但尋香端能百尺竿頭步始見林梢掛角羊又問列子戴兩小兒論日遠近不決而質於孔子孔子不答其意何在學者皆曰聖如夫子亦莫能辨此理是以無說也晦堂亦笑之予作偈釋之曰凉溫遠近轉增疑不答當渠痛處錐尚逐小兒爭未已仲尼何獨古難知歐陽文忠公昔官洛中一日游嵩山却去僕吏放意而往至一山寺入門脩竹滿軒霜清鳥啼風物鮮明文忠休於殿陛旁有老僧閱經自若與語不甚顧答文忠異之曰道人住山久如對曰甚久也又問誦何經對曰法華經文忠曰古之高僧臨生死之際類皆談笑脫去何道致之耶對曰定慧力耳又問今乃寂寥無有何哉老僧笑曰古之人念念在定慧臨終安得亂今之人念念在散亂臨終安得定文忠大驚不自知膝之屈也謝希深甞作文記其事言法華梵相奇古直視不瞬時獨語笑多行市里褰裳而趨或舉指畫空佇立良久從屠沽游飲㗖無所擇道俗共目為狂僧懷禪師未出家時師見之撫其背曰德山臨濟丞相呂許公問佛法大意對曰本來無一物一味總成真僧問世有佛否對曰寺裏文殊有問師為凡耶聖耶舉手曰我不在此住將示化作遺偈其旨不可曉也已而曰我從無量劫來成就逝多國土分身揚化今南歸矣語畢右脇而寂慶歷戊子十一月二十三日也照覺禪師元豐之間革東林律居為叢林天下衲子望風而集咸信敬畏仰以為肉身大士其被賞識者必名聞諸方然未甞輕予人羅漢小南禪師嗣雲居祐公道眼明白未為人知甞至東林照覺鳴鐘集眾出迎于清溪之上其徒大驚自是南之名日益顯著佛印禪師再歸雲居靈源叟初自龍山來與眾群居痛自韜晦佛印陞座白眾請以為座元其禮數特異靈源受之叢林學者日親知晦堂老人法道有在矣嗚呼先德之成就法器使增重於世其法如此堯非不能誅四凶舉十六子也留以遲舜耳雖古聖人所為莫能外是二老其亦知此者歟古塔主去雲門之世無慮百年而稱其嗣青華嚴未始識大陽特以浮山遠公之語故嗣之不疑二老皆以傳言行之自若其於己甚重於法甚輕古之人於法重者永嘉黃檗是也永嘉因閱維摩悟佛心宗而往見六祖曰吾欲定宗旨也黃檗悟馬祖之意而嗣百丈故百丈嘆以為不及也地藏琛禪師能大振雪峰玄沙之道者其秘重大法恬退自處之効也歟予甞想見其為人城隈古寺門如死灰道容清深戲禪客曰諸方說禪浩浩地爭如我此間栽田愽飯喫有旨哉予初居黃龍山時作禪和子十二時偈曰吾活計無可觀但日日長一般夜半子困如死被虱咬動脚指雞鳴丑粥魚吼忙繫裙尋襪紐平旦寅忽欠申兩眉稜重千斤日出卯自攪炒眼誦經口相拗食時辰齒生津輸肚皮虧口唇禺中巳眼前事看見親說不似日南午衣自補忽穿針全體露日昳未方破睡洗開面摸看鼻晡時申最天真順便喜逆便瞋日入酉壁掛口鏡中空日中斗黃昏戌作用密眼開闔烏崒律人定亥說便會法身眠無被盖坐成叢行作隊活鱍鱍無障礙若動著赤肉艾本無一事可營為大家相聚喫莖菜雲峰悅禪師初至高安大愚見芝和尚芝問曰汝來何所求對曰擬學佛法芝曰佛法豈可容易學趂色力強徤為眾乞飯一遭學未晚悅天姿純至信受其言即往行乞既還而芝移居翠嵓悅又詣芝所求入室芝曰佛法且置之大眾夜寒須炭更當乞炭一次學未晚悅又行乞歲晏載炭歸且求示誨芝曰佛法不怕爛却維那方缺人子當就職勿辭也遂鳴犍稚白眾請之悅有難色拜起追悔欲弃去業已當之因中休然恨不曉芝公之意果如何耳一日束破桶引篾觸盆墮地遂大悟方見芝公用處走見芝芝笑呼曰維那且喜大事了畢悅未及吐一言再拜汗如雨而去故其門風孤峻未甞有構之者南禪師甞語大寧老原曰渠欲人人悟解如此豈可得哉神鼎諲禪師少年時與數耆宿游南岳一僧舉論宗乘頗博敏會野山店中供辨而僧論說不已諲曰上人言三界唯心萬法唯識唯識唯心眼聲耳色何人之語僧曰法眼大師偈也諲曰其義如何對曰唯心故根境不相到唯識故聲色摐然諲曰舌味是根境否對曰是諲以箸挾菜置口含胡而言曰何謂相入耶坐者相顧大驚莫能加答諲曰路塗之樂終未到家見解入微不名見道參須實參悟須實悟閻羅大王不怕多語金剛三昧經乃二覺圓通示菩薩行也初元曉造疏悟其以本始二覺為宗故坐牛車置几案於兩角之間據以草文圓覺經以皆證圓覺無時無性為宗故經首敘文不標時處及考其翻譯之代史復不書曉公設事表法圓覺冥合佛意其自覺心靈之影像乎曹溪六祖大師方其韜晦時雜居止於編民混勞侶於商農十有六年蠻兒海竪販夫竈婦得以追呼爾汝及其德加於人道信於天下也雖累朝天子不得而師友之其行聖賢之分故莫知貴賤之異也大宋高僧傳曰天子累召祖竟不往曰吾㒵不揚北人見之必輕法是果祖師之言乎不仁者之言也至人何甞以形骸為䘏況其天形道㒵以慈攝物者其肯不自信耶石頭和尚庵於南臺有年偶見負米登山者問之曰送供米也明日即移菴下梁端遂終於梁端有塔存焉百丈寺在絕頂每日力作以償其供有勸止之者則曰我無德以勞人眾不忍藏去作具因不食故有一日不作一日不食之語先德卒身多如此故六祖以石墜腰牛頭負粮供眾今少年苾蒭擎鉢顰頞曰吾臂酸雪竇禪師作祖英頌古其首篇頌初祖不契梁武曰闔國人追不再來千古萬古空相憶者重嘆老蕭不遇詞也昧者乃敘其事于前曰達磨既去誌公問曰陛下識此人否蓋觀音大士之應身耳傳佛心印至此土奈何不為禮耶老蕭欲追之誌公曰借使闔國人追亦不復來矣雪竇豈不知誌公沒於天鑒十三年而達磨以普通元年至金陵予以是知敘此者非雪竇意也今傳寫又作盖國益可笑又頌洞山麻三斤曰堪憶長慶陸大夫解道合哭不合哭意用長慶語長慶聞陸大夫此語而哭乃問眾曰且道合哭不合哭事見傳燈錄而昧者易曰合笑不合哭失其旨甚矣王文公見禪者多問韓退之見大顛事往往對公妄談者公嗟惜禪者吐辭多臆說不問義理故要謗者多以此有志於宗教者當考證之不可苟也僧問予轉八識成四智從上宗師頗有釋其義者乎予曰曹溪有偈㝡詳曰大圓鏡智性清淨平等性智心無病妙觀察智見非功成所作智同圓鏡五八六七果因轉但轉其名無實性若於轉處不留情繁興永處那伽定以五識第八親相分故曰成所作智同圓鏡是皆果上方轉第六第七無別體故但能了知即性平等是皆因中轉也英邵武開豁明濟之姿盖從上宗門爪牙也甞客雲居掩室不與人交下視四海莫有可其意者曰吾將老死於此山偶夜讀李長者十明論因大悟久之夜經行聞二僧舉老黃龍佛手驢脚因緣異之就問南公今何所寓對曰在黃檗黎明徑造南公一見與語自以謂不及又往見翠嵓真點胸方入室真問曰女子出定意旨如何英引手掐其膝而去真笑曰賣匙箸客未在真自是知其機辯脫略窠臼大稱賞之於是一時學者宗向晚首眾僧於圓通南公見僧自廬山來必問曾依覲英首座否有不識者則曰汝行脚到廬山不識英首座是寶山徒手之說也南公在世不肯開法南公化去師曰大法捨我其誰能荷之耶遂出世住泐潭有偈語甚多今止記其三首可以想見其為人曰石門路險鐵關牢舉目重重萬仞高無角鐵牛衝得破毗盧海內皷波濤又曰萬煅爐中鐵蒺黎直須高價莫饒伊橫來竪去呵呵笑一任旁人鼓是非又曰十方齊現一毫端華藏重重帝網寒珍重善財何處去清宵風撼碧琅玕達觀禪師甞竊笑禪者不問義理如宗門有四種藏鋒初曰就理次曰就事至於理事俱藏則曰入就俱不涉理事則曰出就彼不視字畫輒易就理作袖裏易出就作出袖易入就作入袖就事不可易也則孤令之今德山四家錄所載具存使晚生末學疑長老袖中必有一物出入往來大可笑也晦堂老人見禪者汗漫則笑曰彼出家便依誦八陽經者為師矣其見聞必有淵源南院和尚曰問在答處答在問處夾山曰明中抽橫骨暗中坐舌頭上座玄旨是老僧舌頭老僧玄旨是上座舌頭又曰坐却舌頭別生見解參他活意不參死意達觀曰纔涉唇吻便落意思並是死門故非活路直饒透脫猶在沈淪予甞恠洞山臨濟提倡旨歸多相同盖得前聖為物法式之大要楞嚴曰此方真教體清淨在音聞故舊說多言達磨乃觀音應身指楞伽可以印心則其旨盖甞曰佛語心為宗故也又曰南岳讓公亦觀音應身味其意若非苟然者也有僧謂予曰如古人問大修行人還落因果也無或答曰不落或答曰不昧問如何是大悲千手眼或答曰通身是有聞之者則曰我則不然曰徧身是或問如何是佛或答曰臭肉等來蠅有聞之者曰我則不然破驢脊上足蒼蠅或問擬借一問以為影草時如何或答曰何必有聞之者曰何不道箇不必如諸老宿所示何以分其優劣得達其旨於法無礙謂一切語言無用揀擇信手拈來也耶則彼皆輕重問答錙銖而較之謂臨機直須別辨也耶則彼之理致具在若無可同異者此吾所甞疑不能釋也予曰我不解子之疑然聞世尊在日有比丘根鈍無多聞性佛令誦苕菷二字日夕誦之言苕則已忘菷言菷則又忘苕每自尅責係念不休忽能言曰苕菷於此大悟得無礙辯才子能如誦苕者當見先德大慈悲故為物之心僧讋譍而去法昌倚遇禪師北禪賢公之子住山三十年刀耕火種衲子過門必勘詰之英邵武聖上座皆黃龍高弟與之友善多法句徧叢林晦堂老人甞過之問曰承聞和尚近日造草堂畢工否曰已畢工又問曰幾工可成曰止用數百工遇恚曰大好草堂晦堂拊手笑曰且要天下人疑著臨終時使人要徐德占德占偕靈源禪師馳往至則方坐寢室以院事什物付監寺曰吾自住此至今日以護惜常住故每自蒞之今行矣汝輩著精彩言畢舉手中杖子曰且道這箇付與阿誰眾無對者擲於地投床枕臂而化首山和尚甞作傳法綱要偈曰咄咄拙郎君機妙無人識打破鳳林關穿靴水上立咄咄巧女兒停梭不解織貪看闘雞人水牛也不識汾陽無德禪師注釋之然學者猶莫曉則知古人神悟穎脫之資今人不可企及遠甚予甞嗟誦之淳化三年十二月五日謂眾曰老僧今年六十七老病相依且過日今年記取明年事明年記著今年日至明年時皆無爽復謂眾曰白銀世界金色身情與無情共一真明暗盡時俱不照日輪午後示全身日午安坐而化大般若經曰諸天子竊作是念諸藥叉等言辭呪句雖復隱密而當可知尊者善現於此般若波羅蜜多雖以種種言辭顯示而我等輩竟不能解善現知彼心之所念便告之言汝等天子於我所說不能解耶諸天子言如是如是具壽善現復告言我曾於此不說一字汝亦不聞當何所解何以故甚深般若波羅蜜多文字言說皆遠離故由於此中說者聽者及能解者皆不可得一切如來應正等覺所證無上正等菩提其相甚深亦復如是曹溪大師將入滅方敢全提此令者知大乘種性純熟故僧問歸新州意旨乃曰葉落歸根來時無口至江西馬祖南岳石頭則大振耀之故號石頭為真吼馬祖為全提其機鋒如大火聚擬之則死學者乃欲以意思解不亦悞哉嵩明教每嘆沙門高尚大聖慈廕之力也而晚世紛紛者自卑賤之其見天子無稱臣禮臣之為言公卿士大夫之軄不當僭越取而有之唐令瑫暗識首壞其端歷世因之不疑彼山林野逸之人天子猶不得臣之況沙門乎故其進正宗記之表皆首尾言臣某以存故事至其間當自敘則亦止稱名而已當時公卿閱之重其高識予昔游湘中見沙門作道場至召南岳帝君則屈躬唱曰臣僧某此又何也予頃游京淮東吳間法席至盛然主法者太謙以壞先德之式如前輩升堂攝衣定侍者問訊退然後大眾致敬側立肅聽以重法故於主法者何有哉今則不然長老登座拱立以遲大眾立定乃敢坐獨江西叢林古格不易然予以今日事勢觀之恐他日有甚於京淮東吳也仁宗皇帝與大覺禪師為法喜游和宸詞句甚多然皆蹤迹上語初不敢出新奇宏妙之言至觀其平日所作則驚絕之句甚夥世疑其為瓦注非也昔宋文帝以鮑明遠為中書舍人文帝好文章自謂人莫及明遠識其旨故為文多鄙言世謂其才盡實不然也大覺身世兩忘非明遠委曲事君之比而仁宗皇帝生知道妙涕唾詞章決非宋文所能髣髴然予知璉公之智深而應機之法不得不爾也端師子者東吳人住西余山初見弄師子者遂悟入因以彩素制為皮色或升堂見客則披之遇雪朝披以入城小兒追逐譁之得錢悉以施飢寒者歲以為常誦法華經有功湖人爭迎之開經誦數句則携錢去好歌漁父詞月夜歌之徹旦時有狂僧號回頭和尚鼓動流俗士大夫亦安其妄方與潤守呂公食肉師徑趨至指之曰正當與麼時如何是佛回頭窘無以對師捶其頭推倒而去又有狂僧號不托者於秀州說法聽者傾城師搊住問如何是佛不托擬議師趯之而去師初開堂俞秀老作䟽敘其事曰推倒回頭趯翻不托七軸之蓮經未誦一聲之漁父先聞師聽僧官宣至此以手揶揄曰止乃登座倡曰本是瀟湘一釣客自東自西自南北大眾雜然稱善師𮨇視笑曰我觀法王法法王法如是下座徑去章子厚請師住墳寺方對食子厚言及之師瞋目說偈曰章惇章惇請我看墳我却喫素你却喫葷子厚為大笑呂延安好坐禪而子厚喜鍛師作偈示之曰呂公好坐禪章公好學仙徐六喻擔板各自見一邊圓照禪師方乞身慧林南歸姑蘇見師於丹陽問曰師非端師子耶師曰是圓照戲之曰汝村裏師子耳師應聲曰村裏師子村裏弄眉毛與眼一齊動開却口肚裏直儱侗不愛人取奉直饒弄到帝王宮也是一場乾打閧其意復戲圓照甞應詔往都城故也大覺禪師昔居南岳三生藏有年叢林號璉三生文學議論為時名公卿所敬畏予甞得其與孫莘老書讀之知其為天下奇才也其略曰妙道之意聖人甞寓之於易至周衰先王之法壞禮義亡然後奇言異術間出而亂俗迨我釋迦入中土醇以第一義示人而始末設為慈悲以化眾生亦所以趣時也自生民以來淳樸未散則三皇之教簡而素春也及情竇日鑿則五帝之教詳而文夏也時與世異情隨日遷故三王之教密而嚴秋也昔商周之誥誓後世學者有所難曉彼當時人民聽之而不違則俗與今如何也及其弊而為秦漢也則無所不至而天下有不忍願聞者於是我佛如來一推之以性命之理教之以慈悲之行冬也天有四時循環以生成萬物而聖人之教迭相扶持以化成天下亦猶是而已矣然至其極也皆不能無弊弊迹也道則一耳要當有聖賢者世起而救之也自秦漢至今千有餘歲風俗靡靡愈薄聖人之教列而鼎立互相詆訾不知所從大道寥寥莫之返良可嘆也予讀之不忍置及觀王文公非韓子其詞意與此相合其文曰人有樂孟子之拒楊墨也而以佛老為己功嗚呼莊子所謂夏蟲者其斯人之謂乎道歲也聖人時也執一時而疑歲者終不聞道矣夫聖人之言應時而設昔常是者今盖非也士知其常是也因以為不可變不知所變者言而所同者道也曰然則孰正曰夫春起於冬而以冬為終終天下之道術者其釋氏乎不至於是者皆所謂夏蟲也大般若經曰應觀欲界色界無色界空善現是菩薩摩訶薩作此觀時不令心亂若心不亂則不見法若不見法則不作證又曰如金翅鳥飛騰虗空自在翱翔久下墮落雖依於空戲而不據空亦不為空之所拘礙昔洞山悟本禪師立五位偏正以標準大法約三種滲漏以辨衲子非意斷苟為皆本佛之遺意今叢林聞滲漏之語往往鼻笑雖悟本復出安能為哉大般若經曰一切智智清淨無二無二分無別無斷故古之宗師如臨濟德山趙州雲門之徒皆洞達此意故於一切時心同太虗至於為物作則則要用便用聊觀其一戲則將搏取大千如陶家手未了證者當以事明鞭草血流頑石吼聲則無情非情之異雪中啼竹筍為之茁則無今昔之時嚙指悟子而蔡順來歸則無間隔之處自乳猶子而德秀乳流則無男女等相肇公曰傷夫人情之惑也久矣目對真而莫覺亦以是而已山谷禪師每曰世以相皃觀人之福是大不然福本無象何以觀之惟視其人量之淺深耳又曰觀人之壽夭必視其用心夫動入欺誑者豈長世之人乎寒山子曰語直無背面心真無罪福盖心語相應為人之常然者而前聖貴之有以見世道交喪甚矣大溈真如禪師一生誨門弟子但曰作事但實頭雲盖智禪師有所示必曰但莫瞞心心自靈聖予在湘山雲盖夜坐地爐以帔蒙首夜久聞僧相語曰今四方皆謗臨濟兒孫說平實禪不可隨例虗空中拋筋斗也須令求悟悟箇什麼古人悟則握土成金今人說悟正是見鬼彼皆狂解未歇何日到家去僧曰只如問趙州承聞和尚親見南泉是否答曰鎮州出大蘿蔔頭此意如何其僧笑曰多少分明豈獨臨濟下用此接人趙州亦老婆如是予戲語之曰這僧問端未穩何不曰如何是天下第一等生菜答曰鎮州出大蘿蔔頭平實更分明彼問見南泉而以此對却成虗空中打筋斗聞者傳以為笑靈源禪師為予言彭器資每見尊宿必問道人命終多自由或云自有旨決可聞乎往往有妄言之者器資竊笑之暮年乞守湓江盡禮致晦堂老人至郡齋日夕問道從容問曰臨終果有旨決乎晦堂曰有之器資曰願聞其說答曰待公死時即說器資不覺起立曰此事須是和尚始得予嘆味其言作偈曰馬祖有伴則來彭公死時即道睡裏虱子咬人信手摸得革蚤予夜與僧閱楊大年所作佛祖同源集序至曰昔如來於然燈佛所親蒙記莂實無少法可得是號大覺能仁置卷長嘆大年士大夫其辯慧足以達佛祖無傳之旨今山林衲子反仰首從人求禪道佛法為可笑也僧曰石頭大師曰竺土大僊心東西密相付豈其妄言之耶予謂曰子讀其文之誤所謂密付者非若醫巫家以其術背人相爾汝也直使其自悟明為密耳故長慶巘禪師曰二十八代祖師皆說傳心且不說傳語但破疑情終不於佛心體上答出話頭如道明上座見六祖於大庾嶺上既發悟則曰此外更有密意也無六祖曰我適所說者非密意也一切密意盡在汝邊非特然也如釋迦於然燈佛所但得授記而已如有法可傳則即付與之矣阿難亦甞猛省曰將謂如來惠我三昧前聖語訓具在可以鏡心不然香嚴聞擊竹聲望溈山再拜高亭隔江見德山即橫趨而去何以密耳語哉曹山本寂禪師躭章曰取正命食者須具三種墮一者披毛戴角二者不斷聲色三者不受食時會中有稠布衲問披毛戴角是什麼墮答曰是類墮進曰不斷聲色是什麼墮答曰是隨墮進曰不受食是什麼墮答曰是尊貴墮因又為舉其要曰食者即是本分事本分事知有不取故曰尊貴墮若執初心知有自己及聖位故曰類墮若初心知有己事回光之時擯却聲色香味觸法得寧謐即成功勳後却不執六塵等事隨分而昧任之即礙所以外道六師是汝之師彼師所墮汝亦隨墮乃可取食食者即是正命食也食者亦是却就六根門頭見聞覺知只是不被佗染污將為墮且不是同向前均他本分事尚不取豈況其餘事耶曹山凡言墮謂混不得類不齊耳凡言初心者所謂悟了同未悟耳唐溫尚書造甞問圭峰密禪師悟理息妄之人不復結業一期壽終之後靈性何依密以書答之曰一切眾生無不具覺靈空寂與佛無殊但以無始劫來未曾了悟妄執身為我相故生愛惡等情隨情造業隨業受報生老病死長劫輪回然身中覺性未曾生死如夢被驅使身本安閑如水作冰而濕性不異若能悟此意即是法身本自無生何有倚託靈靈不昧了了常知無所從來亦無所去然多生習妄執以性成喜怒哀樂微細流注真理雖然頴達此情難以卒除須長覺察損之又損如風頓止波浪漸停豈可一身所修便同佛用但可以空寂為自體勿認色身以真知為自心勿認妄念妄念若起都不隨之即臨命終時自然業不能繫雖有中陰所向自由天上人間隨意寄託若愛惡之已泯不受分段之身自然易短為長易麤為妙若微細流注一切寂滅圓覺大智朗然獨存即隨現千百億身度有緣眾生名之曰佛本朝韓侍郎宗古甞以書問晦堂老師曰昔聞和尚開悟曠然無疑但無始以來煩惱習氣未能頓盡為之奈何晦堂答曰敬承書中諭及昔時開悟曠然無疑但無始以來煩惱習氣未能頓盡然心外無剩法者不知煩惱習氣是何物而欲盡之若起此心翻成認賊為子也從上以來但有言說乃是隨病設藥縱有煩惱習氣但以如來知見治之皆是善權方便誘引之說若是定有習氣可治却是心外有法而可盡之譬如靈龜曳尾於塗拂迹迹生可謂將心用心轉見病深苟能明達心外無法法外無心心法既無更欲教誰頓盡邪伏奉來諭略敘少答以為山中之信耳二老今古之宗師也其隨宜方便自有意味初無優劣然圭峰所答之詞正韓公所問之意而語不失宗開廓正見以密較之晦堂所得多矣永明和尚曰夫祖佛正宗則真誰識才有信處皆可為人若論修證之門諸方皆云功未齊於諸聖且教中所許初心菩薩皆可比知亦許約教而會先以聞解信入後以無思契同若入信門便登祖位且約現今世間之事於眾生界中第一比知第二現知第三約教而知第一比知者且如即今有漏之身夜皆有夢夢中所見好惡境界憂喜宛然覺來床上安眠何曾是實並是夢中意識思想所為則可比知覺時所見之事皆如夢中無實夫過去未來現在三世境界元是第八阿賴耶識親相分唯是本識所變若現在之境是明了意識分別若過去未來之境是獨散意識思惟夢覺之境雖殊俱不出於意識則唯心之旨比況昭然第二現知者即是對事分明不待立況且如現見青白物時物本自虗不言我青我白皆是眼識分與同時意識計度分別為青為白以意辨為色以言說為青皆是意言自妄安置以六塵鈍故體不自立名不自呼一色既然萬法咸爾皆無自性悉是意言故曰萬法本閑而人自閙是以若有心起時萬境皆有若空心起處萬境皆空則空不自空因心故空有不自有因心故有既非空非有則唯識唯心若無於心萬法安寄又如過去之境何曾是有隨念起處忽然現前若想不生境終不現此皆是眾生日用可以現知不待功成豈假修得凡有心者並可證知故先德云如大根人知唯識者恒觀自心意言為境此初觀時雖未成聖分知意言則是菩薩第三約教而知者大經云三界唯心萬法唯識此是所證本理能詮正宗也予甞三復此言歎佛祖所示廣大坦夷明白簡易如此而亦鮮有諦信之者何也清凉國師有言曰行人當勤勇念知顯修之儀以貪著世事無始惡習離之甚難過於世間慈父離於孝子故須精進方能除遣勤則欲勤䇿勵勇猛不息念則明記不忘知則決斷無悔予願守清凉之訓以遵永明之旨與諸同志入圓寂道場嵩明教初自洞山游康山託迹開先法席主者以其佳少年銳於文學命掌書記明教笑曰我豈為汝一盃薑杏湯耶因去之居杭之西湖三十年閉關不妄交嘉祐中以所譔輔教編定祖圖正宗記詣闕上之翰林王公素時權開封為表薦於朝仁宗皇帝加歎久之下其書於中書宰相韓公參政歐公閱其文大驚譽於朝士大夫書竟賜入藏明教名遂聞天下晚移居靈隱之北永安蘭若清旦誦金剛般若經不輟音齋罷讀書賓客至則清談不及世事甞曰客去清談少年高白髮饒夜分誦觀世音名號滿十萬聲則就寢其苦硬清約之風足以追配鐘山僧遠予甞見其手書與月禪師曰數年來欲製紙被一翻以禦苦寒今幸已成之想聞之大笑也臨終安坐微笑索筆作偈曰後夜月初明予將獨自行不學大梅老猶貪鼯鼠聲師得法於洞山聰禪師而宗派圖系於德山遠公法嗣之列誤矣
